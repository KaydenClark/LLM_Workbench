    if (verdict && !option) { setSaveStatus(article, 'Not saved', 'Choose an answer to save this note; your earlier answer stays as it was until then.'); return Promise.resolve(); }
    if (option?.requiresNote && !note.trim()) { setSaveStatus(article, 'Not saved', `${option.label} needs your note; nothing is saved until you type it.`); return Promise.resolve(); }
    const draft = { verdict, note, itemRevision: item.revision };
    const run = async () => {
      setSaveStatus(article, 'Saving…', '');
      try {
        const response = await fetch(`/api/answers/${id}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...draft, expectedAnswerAt: item.answer?.at ?? null }) });
        const body = await response.json();
        if (!response.ok) { const error = new Error(body.error?.message || response.status); error.status = response.status; throw error; }
        state.errors.delete(id);
        item.answer = body; item.derivedStatus = body.derivedStatus;
        item.answerLabel = item.controls.options.find(candidate => candidate.value === body.verdict)?.label || body.verdict;
        const latest = state.edits.get(id);
        if (latest && latest.verdict === verdict && latest.note === note) state.edits.delete(id);
        const current = document.getElementById(id) || article;
        setSaveStatus(current, `Saved ${new Date(body.at).toLocaleTimeString()}`, '');
        current.dataset.status = body.derivedStatus;
        const badge = current.querySelector('.item-head .badge');
        badge.className = `badge ${body.derivedStatus}`; badge.textContent = STATUS_LABEL[body.derivedStatus];
        refreshAnswer(current, item);
        if (!staleNotice(item)) current.querySelector('[data-stale-notice]')?.remove();
        // The workflow derives each card's state from the saved answer.
        await loadWorkflow();
        refreshCounts();
        renderCardWorkflow((document.getElementById(id) || current).querySelector('[data-flow]'), item);
      } catch (error) {
        const message = error.status === 409 ? `Not saved: ${error.message}. Reload to see the current question and answer; your typed text stays here until then.` : `Save failed: ${error.message}. Your unsaved text remains here.`;
        state.errors.set(id, message);
        setSaveStatus(document.getElementById(id) || article, 'Not saved', message);
      }
    };
    const queued = () => { const promise = (state.inflight.get(id) || Promise.resolve()).then(run); state.inflight.set(id, promise); promise.finally(() => { if (state.inflight.get(id) === promise) state.inflight.delete(id); }); return promise; };
    if (!delay) return queued();
    state.timers.set(id, setTimeout(queued, delay));
    return Promise.resolve();
  }
  function refreshCounts() {
    renderNavigation();
    renderBatchProgress();
    renderOverview();
    renderRoundPanel();
    const start = document.getElementById('start-batch');
    if (start) {
      const remaining = state.board.items.filter(visible).filter(item => ['pending', 'stale', 'parked'].includes(laneFor(item))).length;
      start.textContent = `Start next ${Math.min(state.size, remaining)}`;
      start.disabled = !remaining || Boolean(state.batch);
    }
    for (const row of document.querySelectorAll('.question-row')) {
      const item = state.board.items.find(candidate => candidate.id === row.dataset.row);
      const badge = row.querySelector('.badge');
      badge.textContent = LANES[laneFor(item)]; badge.className = `badge ${item.derivedStatus}`;
    }
  }

  // ---- Comments, rounds and promotion (owner-triggered only). ----
  function newActionId() {
    try { return crypto.randomUUID(); } catch { return `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
  }
  // One action ID per intended action, reused until it succeeds, so a repeated
  // or retried click is recorded once (the workflow treats it as idempotent).
  // A retry of an interrupted comment passes its original actionId.
  async function runAction(key, url, body, actionId) {
    if (actionId) state.actions.set(key, actionId);
    else if (!state.actions.has(key)) state.actions.set(key, newActionId());
    const response = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, actionId: state.actions.get(key), expectedRevision: state.workflow?.revision ?? 0 }) });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (result.error?.code === 'action-id-conflict') state.actions.delete(key);
      const error = new Error(result.error?.message || `${url} answered ${response.status}`);
      error.status = response.status;
      throw error;
    }
    state.actions.delete(key);
    await loadWorkflow();
    return result;
  }
  function actionError(target, error) {
    if (!target) return;
    target.innerHTML = error.status === 409
      ? `<span class="err">${esc(error.message)}</span> The board changed since you read it; nothing was recorded twice. <button type="button" class="bulk" data-reload-all>Reload and review</button>`
      : `<span class="err">${esc(error.message)}</span>`;
    const reload = target.querySelector('[data-reload-all]');
    if (reload) reload.onclick = () => reloadAll();
  }
  async function promoteItems(items, statusTarget) {
    if (!items.length) return;
    const ids = items.map(item => item.id).sort();
    await runAction(`promote:${ids.join(',')}`, '/api/promotions', { ids, revisions: Object.fromEntries(items.map(item => [item.id, item.revision])) });
    state.promote.clear();
    if (statusTarget) statusTarget.textContent = `Promotion requested for ${ids.length} confirmed card${ids.length === 1 ? '' : 's'}. A director picks it up; no agent starts automatically.`;
    renderRoundPanel();
    renderFocus();
  }
  function renderRoundPanel() {
    const panel = document.getElementById('round-workflow');
    if (!state.board) return;
    if (!state.workflow) {
      panel.innerHTML = `<h2>Rounds and promotion</h2><p class="error-box">The owner workflow record could not be read: ${esc(state.workflowError || 'not loaded')}. Answers still save; rounds, comments and promotion are unavailable until it reads.</p>`;
      return;
    }
    const confirmed = confirmedItems();
    for (const id of [...state.promote]) if (!confirmed.some(item => item.id === id)) state.promote.delete(id);
    panel.innerHTML = `<h2>Rounds and promotion</h2>
      <p>Answer over as many rounds as you need; unanswered and unconfirmed cards stay in grilling. Promotion is separate and explicit: it prepares a director handoff through Record → Publish → Map → Publish → Plan → Publish.</p>
      <div class="batch-actions"><button class="bulk" type="button" id="end-round" ${state.edits.size ? 'disabled' : ''}>End this round</button><small>Records which cards are confirmed now. It starts no agent and promotes nothing.${state.edits.size ? ' Save or finish your unsaved notes first.' : ''}</small></div>
      <details><summary>Confirmed cards ready for promotion (${confirmed.length})</summary>
        ${confirmed.length ? `<div class="confirmed-list">${confirmed.map(item => `<label><input type="checkbox" data-promote-pick="${item.id}" ${state.promote.has(item.id) ? 'checked' : ''}> ${esc(item.title)} <small>${item.id} · ${esc(item.answerLabel)}</small></label>`).join('')}</div>` : '<p>No card is in the workflow\'s confirmed state (a current exact confirmation, no Change awaiting revision, not already requested).</p>'}
        <button class="primary" type="button" id="promote-selected" ${state.promote.size ? '' : 'disabled'}>Start promotion for selected confirmed cards (${state.promote.size})</button>
      </details>
      <p id="round-result" role="status">${state.workflow.rounds.length} rounds ended · ${state.workflow.requests.length} promotion handoffs requested.</p>`;
    const result = document.getElementById('round-result');
    document.getElementById('end-round').onclick = async event => {
      event.target.disabled = true;
      try { const saved = await runAction('round', '/api/rounds', {}); result.textContent = `Round ${saved.round.number} ended with ${saved.round.confirmed.length} confirmed cards recorded. No agent was started.`; }
      catch (error) { actionError(result, error); }
      finally { event.target.disabled = false; }
    };
    for (const box of panel.querySelectorAll('[data-promote-pick]')) box.onchange = () => {
      if (box.checked) state.promote.add(box.dataset.promotePick); else state.promote.delete(box.dataset.promotePick);
      const button = document.getElementById('promote-selected');
      button.disabled = !state.promote.size; button.textContent = `Start promotion for selected confirmed cards (${state.promote.size})`;
    };
    document.getElementById('promote-selected').onclick = async event => {
      event.target.disabled = true;
      try { await promoteItems(confirmed.filter(item => state.promote.has(item.id)), result); }
      catch (error) { actionError(result, error); event.target.disabled = false; }
    };
  }
  function receiptLinks(values) {
    return (values || []).map(value => sourceLink(value, typeof value === 'string' ? value : value.path || value.url)).join(' · ');
  }
  // Requested → Record → Publish → Map → Publish → Plan → Publish (and
  // Implemented when the Map said implementation is needed). How far a card
  // has come is the workflow's card state; each reached step shows its
  // receipt's links, evidence or visible no-op reason.
  const CARD_PROGRESS = ['handoff-requested', 'recorded', 'record-published', 'mapped', 'map-published', 'planned', 'plan-published', 'implemented'];
  function dispositionTimeline(request, disposition, card) {
    const current = card && card.requestId === request.id ? card : null;
    const reached = current ? Math.max(0, CARD_PROGRESS.indexOf(current.state)) : 0;
    const receipts = disposition?.requestId === request.id ? disposition.receipts || [] : [];
    const stages = [...request.stages];
    if (current?.mapping?.implementationNeeded === true || receipts.length > stages.length) stages.push('Implemented');
    const steps = stages.map((stage, index) => {
      const receipt = receipts[index];
      const done = index < reached;
      if (!done) return `<li class="${index === reached ? 'next' : ''}"><strong>${esc(stage)}</strong><small>${index === reached ? 'Next; waiting for a director.' : 'Not reached.'}</small></li>`;
      if (!receipt) return `<li class="done"><strong>${esc(stage)}</strong></li>`;
      const noOp = receipt.implementationNeeded === false && ['Map', 'Plan'].includes(stage);
      return `<li class="done"><strong>${esc(stage)}</strong> · ${esc(receipt.by)} · ${esc(receipt.at)}${noOp ? `<small>No Spec or Task: ${esc(receipt.reason)}</small>` : receipt.reason ? `<small>${esc(receipt.reason)}</small>` : ''}${receipt.links?.length ? `<small>Result: ${receiptLinks(receipt.links)}</small>` : ''}${receipt.evidence?.length ? `<small>Evidence: ${receiptLinks(receipt.evidence)}</small>` : ''}</li>`;
    });
    const heading = current ? esc(current.label) : 'an earlier request, replaced by a newer one';
    return `<div class="request"><strong>Promotion handoff · ${heading}</strong>${current?.revisedSinceRequest ? '<p class="stale-box">The question was revised after this request; the request still carries the wording you confirmed then.</p>' : ''}<ol class="timeline"><li class="done"><strong>Requested</strong> · ${esc(request.requestedAt)}<small>Handoff ${esc(request.id)}, ready for a director. No agent starts automatically.</small></li>${steps.join('')}</ol></div>`;
  }
  function approvalSummary(item) {
    const approval = item.answer?.approval;
    if (!approval) return '<p>No exact-wording confirmation is recorded for this question.</p>';
    const current = item.answer.itemRevision === item.revision;
    return `<p>Confirmed snapshot · revision ${approval.itemRevision} · SHA-256 <code>${esc(approval.hash)}</code>. ${current ? 'This is the current revision.' : 'The question has changed since; it needs a fresh confirmation.'}</p><details><summary>Exactly what was confirmed</summary><div class="reader">${markdown(approval.draft || approval.proposal)}</div></details>`;
  }
  // Unsent comment or change-request text, kept in page state beside the
  // unsaved answer edits, keyed by question and revision, so every re-render
  // of the card restores it; it clears only when the comment is sent.
  const commentKey = item => `${item.id}@${item.revision}`;
  function rememberComment(item, text) { if (String(text)) state.comments.set(commentKey(item), String(text)); else state.comments.delete(commentKey(item)); }
  function commentDraftFor(item) { return state.comments.get(commentKey(item)) || ''; }
  function forgetComment(item) { state.comments.delete(commentKey(item)); }
  function hasUnsavedWork() { return state.edits.size > 0 || [...state.comments.values()].some(text => String(text).trim()); }
  // Why this card cannot be promoted now, in the owner's terms.
  function promotionBlocker(item) {
    if (state.edits.has(item.id)) return 'Save or finish your unsaved answer first.';
    const change = (state.workflow?.comments || []).find(comment => comment.id === item.id && comment.kind === 'change' && comment.itemRevision === item.revision);
    if (change) return `Your change request of ${change.at || 'this revision'} (“${change.text}”) is waiting: an agent must revise this question from it, and you must confirm the revised question, before it can be promoted.`;
    return 'Only a card the workflow reports as confirmed can be promoted.';
  }
  function cardWorkflowHtml(item) {
    if (!state.workflow) return `<h4>Comments and promotion</h4><p class="error-box">Unavailable: ${esc(state.workflowError || 'the owner workflow record is not loaded')}.</p>`;
    const comments = state.workflow.comments.filter(comment => comment.id === item.id);
    const requests = state.workflow.requests.filter(request => request.cards.some(card => card.id === item.id));
    const card = cardState(item);
    const promotable = confirmedItems().some(candidate => candidate.id === item.id);
    const why = promotable ? '' : promotionBlocker(item);
    const draft = commentDraftFor(item);
    const sendable = Boolean(draft.trim());
    return `<h4>Comments, change requests and promotion</h4>
      <p>Workflow state: <strong>${esc(card?.label || 'unknown')}</strong></p>
      ${approvalSummary(item)}
      <label for="comment-${item.id}">Comment or change request</label>
      <textarea id="comment-${item.id}" data-comment-text placeholder="Saved as its own file under workbench/grill-board/comments/">${esc(draft)}</textarea>
      <div class="batch-actions"><button class="bulk" type="button" data-comment="comment" ${sendable ? '' : 'disabled'}>Save as a comment</button><button class="bulk" type="button" data-comment="change" ${sendable ? '' : 'disabled'}>Send a change request</button><small>Neither approves anything and neither starts an agent.</small></div>
      ${comments.map(comment => `<div class="request"><strong>${comment.kind === 'change' ? 'Change request' : 'Comment'} · revision ${comment.itemRevision}</strong><p>${esc(comment.text)}</p><small>${esc(comment.status || 'requested')} · ${esc(comment.at || '')}</small>${comment.recorded === false ? `<p class="stale-box">${esc(comment.recovery || 'Saved, but not yet recorded in the workflow.')} <button type="button" class="bulk" data-retry-comment="${esc(comment.actionId)}">Finish recording it</button></p>` : ''}</div>`).join('')}
      <div class="batch-actions"><button class="primary" type="button" data-promote ${promotable ? '' : 'disabled'}>Start promotion for this confirmed card</button><small>${esc(why)}</small></div>
      ${requests.map(request => dispositionTimeline(request, state.workflow.dispositions[item.id], card)).join('')}
      <p class="flow-result" role="status"></p>`;
  }
  function renderCardWorkflow(panel, item) {
    if (!panel) return;
    panel.innerHTML = cardWorkflowHtml(item);
    if (!state.workflow) return;
    const comments = state.workflow.comments.filter(comment => comment.id === item.id);
    const text = panel.querySelector('[data-comment-text]');
    const result = panel.querySelector('.flow-result');
    text.oninput = () => { rememberComment(item, text.value); for (const button of panel.querySelectorAll('[data-comment]')) button.disabled = !text.value.trim(); };
    for (const button of panel.querySelectorAll('[data-comment]')) button.onclick = async () => {
      const words = text.value.trim();
      if (!words) return;
      button.disabled = true;
      try { await runAction(`comment:${item.id}:${button.dataset.comment}:${words}`, '/api/comments', { id: item.id, itemRevision: item.revision, kind: button.dataset.comment, text: words }); forgetComment(item); renderCardWorkflow(panel, item); renderRoundPanel(); }
      catch (error) { actionError(result, error); button.disabled = false; }
    };
    // An interrupted comment is finished by resending its original action ID
    // with the payload rebuilt from the saved comment record.
    for (const button of panel.querySelectorAll('[data-retry-comment]')) button.onclick = async () => {
      const comment = comments.find(candidate => candidate.actionId === button.dataset.retryComment);
      if (!comment) return;
      button.disabled = true;
      try { await runAction(`retry:${comment.actionId}`, '/api/comments', { id: comment.id, itemRevision: comment.itemRevision, kind: comment.kind, text: comment.text }, comment.actionId); renderCardWorkflow(panel, item); renderRoundPanel(); }
      catch (error) { actionError(result, error); button.disabled = false; }
    };
    panel.querySelector('[data-promote]').onclick = async event => {
      event.target.disabled = true;
      try { await promoteItems([item], result); }
      catch (error) { actionError(result, error); event.target.disabled = false; }
    };
    wireViews(panel);
  }

  // ---- Shell and routing. ----
  function setView(view, tab) {
    state.view = view;
    const grilling = view === 'grilling';
    document.getElementById('shell').classList.toggle('wide', !grilling);
    document.getElementById('grill-nav').hidden = !grilling;
    document.getElementById('questions-panel').hidden = !grilling;
    document.getElementById('section-panel').hidden = grilling;
    for (const link of document.querySelectorAll('#section-tabs a')) {
      if (link.dataset.section === tab) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    }
    document.title = `${SECTIONS[tab] || 'Search'} · Workbench Dashboard`;
  }
  function focusHeading(panel) { const heading = panel.querySelector('h1'); if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); } }
  async function routePage() {
    if (!state.board || !state.catalog) return;
    const serial = ++state.route;
    const raw = location.hash.slice(1);
    const params = new URLSearchParams(raw);
    const panel = document.getElementById('section-panel');
    const section = params.get('section'), file = params.get('artifact'), group = params.get('artifacts'), query = params.get('search');
    state.artifact = null;
    if (/^GB-\d{4}$/.test(raw) || !raw || raw === 'questions' || section === 'grilling') {
      const returning = state.view !== 'grilling';
      setView('grilling', 'grilling');
      const target = state.board.items.find(item => item.id === raw);
      if (target) {
        if (!visible(target)) { state.inBatch = false; resetSlice(); state.topic = topicFor(target); }
        state.focus = target.id; render();
        document.getElementById('focus')?.scrollIntoView({ block: 'start' });
      } else if (returning) window.scrollTo(0, state.questionScroll || 0);
      return;
    }
    if (state.view === 'grilling') state.questionScroll = window.scrollY;
    try {
      if (section === 'whys') { setView('whys', 'grilling'); renderWhys(panel); }
      else if (section === 'tracker' || section === 'taskboard') { setView(section, section); await renderSourceSection(section, panel, serial); }
      else if (section === 'drafts') { setView('drafts', 'drafts'); await renderDrafts(panel, serial); }
      else if (section === 'wiki') { setView('wiki', 'wiki'); renderWiki(panel); }
      else if (group) { setView('wiki', 'wiki'); renderGroup(panel, group); }
      else if (file) { setView('wiki', 'wiki'); await renderArtifact(panel, file, params, serial); return; }
      else if (query !== null) { setView('search', null); await renderSearch(panel, query, serial); }
      else { setView('grilling', 'grilling'); return; }
      if (serial === state.route) { window.scrollTo(0, 0); focusHeading(panel); }
    } catch (error) {
      if (serial === state.route) panel.innerHTML = `<h1>Could not read this section</h1><p class="error-box">${esc(error.message)}</p><button class="bulk" type="button" id="route-retry">Read again</button>`;
      const retry = document.getElementById('route-retry');
      if (retry) retry.onclick = () => { state.dashboard = null; state.drafts = null; routePage(); };
    }
  }

  // ---- Whys. ----
  function renderWhys(panel) {
    const rows = whysList(state.board.items, { query: state.whyQuery, status: state.whyStatus });
    const all = whysList(state.board.items);
    panel.innerHTML = `<p><a href="#section=grilling">← Grilling Board</a></p><h1>Whys list</h1>
      <p class="semantics">Your <strong>Change the why</strong> answers: something is correct, but the underlying reason is wrong. An agent fixes the rationale in the owning decision record.</p>
      <div class="section-filter"><label for="why-query">Filter</label><input type="search" id="why-query" value="${esc(state.whyQuery)}" placeholder="Title, ID or your note"><label for="why-status">Status</label><select id="why-status">${['all', 'answered', 'applied', 'stale', 'pending', 'superseded'].map(status => `<option value="${status}" ${state.whyStatus === status ? 'selected' : ''}>${status === 'all' ? 'All statuses' : STATUS_LABEL[status]}</option>`).join('')}</select><span>${rows.length} of ${all.length}</span></div>
      <div id="why-rows">${rows.map(row => `<article class="why-row"><h3><a href="#${row.id}">${esc(row.title)}</a></h3><span class="identity">${row.id} · answered at revision ${row.itemRevision}${row.revision !== row.itemRevision ? ` (question now at revision ${row.revision})` : ''}</span><blockquote>${esc(row.note)}</blockquote><span class="badge ${row.status}">${STATUS_LABEL[row.status] || row.status}</span>${row.current ? '' : ' <small>an earlier answer, since replaced</small>'} <small>${esc(row.at || '')}</small></article>`).join('') || '<p class="empty">No Change the why answers match.</p>'}</div>`;
    document.getElementById('why-query').oninput = event => { state.whyQuery = event.target.value; renderWhys(panel); const input = document.getElementById('why-query'); input.focus(); input.setSelectionRange(input.value.length, input.value.length); };
    document.getElementById('why-status').onchange = event => { state.whyStatus = event.target.value; renderWhys(panel); document.getElementById('why-status').focus(); };
  }

  // ---- Destination Tracker and Taskboard: native projections, distinct semantics. ----
  async function dashboardData() {
    if (!state.dashboard) state.dashboard = await getJson('/api/dashboard');
    return state.dashboard;
  }
  function distributionBar(distribution, steps) {
    const parts = steps.map((step, index) => ({ step, value: Number(distribution?.[step] || 0), color: STEP_COLORS[index % STEP_COLORS.length] }));
    const text = parts.map(part => `${part.step} ${part.value.toFixed(1)}%`).join(', ');
    return `<div class="distribution" role="img" aria-label="${esc(text)}">${parts.filter(part => part.value > 0).map(part => `<span style="width:${part.value}%;background:var(${part.color})" title="${esc(part.step)} ${part.value.toFixed(1)}%"></span>`).join('')}</div>`;
  }
  function legend(steps) { return `<div class="legend">${steps.map((step, index) => `<span><i style="background:var(${STEP_COLORS[index % STEP_COLORS.length]})"></i>${esc(step)}</span>`).join('')}</div>`; }
  function sourceErrors(data, kinds) {
    const errors = (data.errors || []).filter(error => kinds.includes(error.source));
    return errors.map(error => `<p class="error-box">${esc(error.source)}${error.path ? ` · ${esc(error.path)}` : ''}: ${esc(error.message)}</p>`).join('');
  }
  async function renderSourceSection(section, panel, serial) {
    panel.innerHTML = `<h1>${SECTIONS[section]}</h1><p>Reading current source records…</p>`;
    const data = await dashboardData();
    if (serial !== state.route) return;
    const refresh = '<button class="bulk" type="button" id="refresh-sources">Read sources again</button>';
    if (section === 'tracker') {
      const model = data.tracker;
      const head = `<h1>Destination Tracker</h1><p class="semantics">Understanding: how far each Landmark's Destination Question Cards are understood, Idea through Verified. This is not delivery progress, and a done Task never establishes verified understanding. Execution lanes are on the <a href="#section=taskboard">Taskboard</a>.</p>${refresh}${sourceErrors(data, ['tracker', 'manifest'])}`;
      if (model?.status !== 'available') { panel.innerHTML = `${head}<p class="error-box">The Landmark Tracker could not be read: ${esc(model?.error?.message || 'unavailable')}. No substitute projection is shown; the records stay readable in the <a href="#artifacts=landmarks">Wiki</a>.</p>`; wireRefresh(); return; }
      const tracker = model.tracker, steps = tracker.steps || [];
      const workbench = tracker.workbench || {};
      panel.innerHTML = `${head}
        <section class="landmark-card"><h2>Whole Workbench</h2><p>${workbench.items ?? 0} assessed items · ${esc(workbench.status || 'unknown')} · ${Number(tracker.workbench?.unassessedPercent || 0).toFixed(1)}% unassessed</p>${distributionBar(workbench.distribution, steps)}${legend(steps)}</section>
        <div class="section-filter"><label for="tracker-filter">Filter Landmarks</label><input type="search" id="tracker-filter" placeholder="Title or ID"></div>
        <div id="landmark-cards">${(tracker.landmarks || []).map(landmark => `<section class="landmark-card" data-filter="${esc(`${landmark.title} ${landmark.id}`.toLowerCase())}"><h3><button type="button" class="link-button" data-inspect-id="${esc(landmark.id)}">${esc(landmark.title)}</button></h3><span class="identity">${esc(landmark.id)}</span><p>${esc(landmark.summary || '')}</p>${distributionBar(landmark.aggregate?.distribution, steps)}<small>${landmark.aggregate?.items ?? 0} items · ${esc(landmark.aggregate?.status || 'unknown')} · ${(landmark.aggregate?.unassessed || []).length} unassessed</small><div class="chips">${(landmark.questions || []).map(id => `<button type="button" data-inspect-id="${esc(id)}">${esc(titleForId(id))}</button>`).join('')}</div></section>`).join('') || '<p class="empty">No Landmarks recorded.</p>'}</div>`;
      document.getElementById('tracker-filter').oninput = event => { const q = event.target.value.toLowerCase(); for (const cardEl of panel.querySelectorAll('#landmark-cards [data-filter]')) cardEl.hidden = q && !cardEl.dataset.filter.includes(q); };
    } else {
      const model = data.taskboard;
      const head = `<h1>Taskboard</h1><p class="semantics">Execution: Specs and Tasks in their native execution lanes. Approval and verification stay in the source records, and a done Task never establishes verified understanding; understanding is on the <a href="#section=tracker">Destination Tracker</a>.</p>${refresh}${sourceErrors(data, ['taskboard', 'specs', 'tasks', 'landmarks', 'manifest'])}`;
      if (model?.status !== 'available') { panel.innerHTML = `${head}<p class="error-box">The Taskboard could not be read: ${esc(model?.error?.message || 'unavailable')}. No substitute execution projection is shown; Specs and Tasks stay readable in the <a href="#artifacts=specs">Wiki</a>.</p>`; wireRefresh(); return; }
      const lanes = model.board.lanes || {};
      panel.innerHTML = `${head}<div class="section-filter"><label for="task-filter">Filter cards</label><input type="search" id="task-filter" placeholder="Title or ID"></div><div class="lanes">${Object.entries(lanes).map(([lane, cards]) => {
        const entries = Object.entries(cards);
        return `<section class="lane"><h2>${esc(LANE_TITLES[lane] || lane)} <small>${entries.length}</small></h2><details ${lane === 'complete' ? '' : 'open'}><summary>${lane === 'complete' ? `Show ${entries.length} complete` : 'Cards'}</summary>${entries.map(([key, cardData]) => `<button type="button" class="source-card" data-card="${esc(lane)}|${esc(key)}" data-filter="${esc(`${cardData.title} ${key}`.toLowerCase())}"><strong>${esc(cardData.title)}</strong><small>${esc(key)}${cardData.priority ? ` · priority ${esc(cardData.priority)}` : ''}</small>${cardData.nextAction ? `<small>Next: ${esc(cardData.nextAction)}</small>` : ''}${(cardData.dependencies || []).length ? `<small>${cardData.dependencies.length} dependencies</small>` : ''}</button>`).join('') || '<p class="empty">None.</p>'}</details></section>`;
      }).join('')}</div>`;
      document.getElementById('task-filter').oninput = event => { const q = event.target.value.toLowerCase(); for (const cardEl of panel.querySelectorAll('.source-card')) cardEl.hidden = q && !cardEl.dataset.filter.includes(q); };
      for (const button of panel.querySelectorAll('[data-card]')) button.onclick = () => {
        const [lane, ...rest] = button.dataset.card.split('|');
        const key = rest.join('|');
        const cardData = lanes[lane][key];
        const relationships = [...(cardData.sourceLinks || []).slice(1).map(file => ({ label: 'Source', path: file })), ...(cardData.dependencies || []).map(text => ({ label: 'Depends on', text }))];
        openInspector(cardData.sourceLinks?.[0], { title: cardData.title, id: key, status: `${LANE_TITLES[lane] || lane} (execution lane)`, relationships, facts: [['Next action', cardData.nextAction], ['Assignee', cardData.assignee], ['Approver', cardData.approver], ['Required QA', (cardData.requiredQA || []).join(', ')]] });
      };
    }
    for (const button of panel.querySelectorAll('[data-inspect-id]')) button.onclick = () => inspectId(button.dataset.inspectId);
    wireRefresh();
  }
  function wireRefresh() { const button = document.getElementById('refresh-sources'); if (button) button.onclick = () => { state.dashboard = null; routePage(); }; }
  function artifactForId(id) { return (state.dashboard?.artifacts || []).find(artifact => artifact.id === id && artifact.format === 'json') || (state.dashboard?.artifacts || []).find(artifact => artifact.id === id) || state.catalog?.artifacts.find(artifact => artifact.id === id) || null; }
  function titleForId(id) { const artifact = artifactForId(id); return artifact ? `${artifact.title} · ${id}` : id; }
  function inspectId(id) {
    const artifact = artifactForId(id);
    if (!artifact) { openInspector(null, { title: id, id, status: 'No readable source record was found for this identifier.' }); return; }
    openInspector(artifact.path, { title: artifact.title, id: artifact.id });
  }
  // One inspector for every card: title first, ID second, status, source path
  // and revision, relationships, then the readable source text.
  async function openInspector(file, extra = {}) {
    const dialog = document.getElementById('inspector');
    const known = (file && ((state.dashboard?.artifacts || []).find(artifact => artifact.path === file) || catalogArtifact(file))) || {};
    document.getElementById('inspector-title').textContent = extra.title || known.title || file || 'Source';
    document.getElementById('inspector-id').textContent = extra.id || known.id || '';
    const body = document.getElementById('inspector-body');
    const relationships = [...(known.relationships || []).map(rel => ({ label: rel.type || 'Related', id: rel.id })), ...(extra.relationships || [])];
    const facts = (extra.facts || []).filter(([, value]) => value);
    const header = (revision, status) => `<dl class="facts"><dt>Status</dt><dd>${esc(extra.status || status || known.status || 'unknown')}</dd><dt>Source</dt><dd>${file ? esc(file) : 'none'}</dd><dt>Revision</dt><dd>${esc(revision ?? known.revision ?? 'unavailable')}</dd>${facts.map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join('')}${relationships.length ? `<dt>Relationships</dt><dd>${relationships.map(rel => rel.id ? `<button type="button" class="link-button" data-inspect-id="${esc(rel.id)}">${esc(rel.label)}: ${esc(titleForId(rel.id))}</button>` : rel.path ? `${esc(rel.label)}: ${sourceLink(rel.path)}` : `${esc(rel.label)}: ${esc(rel.text)}`).join('<br>')}</dd>` : ''}</dl>${file && catalogArtifact(file) ? `<p><a href="${esc(artifactHref(file))}" data-close-inspector>Open in the Wiki</a></p>` : ''}`;
    body.innerHTML = `${header()}<p>${file ? 'Reading the source…' : ''}</p>`;
    const wire = () => {
      for (const button of body.querySelectorAll('[data-inspect-id]')) button.onclick = () => inspectId(button.dataset.inspectId);
      for (const link of body.querySelectorAll('[data-close-inspector], a[href^="#"]')) link.addEventListener('click', () => dialog.close());
      wireViews(body);
    };
    wire();
    if (!dialog.open) dialog.showModal();
    if (!file) return;
    try {
      const artifact = await getJson(`/api/artifact?path=${encodeURIComponent(file)}`);
      const recordRevision = artifact.format === 'json' ? (() => { try { return JSON.parse(artifact.text).revision; } catch { return null; } })() : null;
      body.innerHTML = `${header(recordRevision ? `record revision ${recordRevision} · SHA-256 ${artifact.revision}` : `SHA-256 ${artifact.revision}`, artifact.status)}<div class="reader">${artifact.format === 'json' ? recordFields(JSON.parse(artifact.text), file) : markdown(artifact.text, file)}</div>`;
    } catch (error) {
      body.innerHTML = `${header()}<p class="error-box">The source text could not be read: ${esc(error.message)}</p>`;
    }
    wire();
  }

  // ---- Drafts to approve. ----
  function approvalLine(approval) {
    const short = hash => hash ? `<code title="${esc(hash)}">${esc(hash.slice(0, 12))}…</code>` : '';
    if (approval.state === 'current') return `<p class="ok-box">Approved: you confirmed this exact wording at revision ${approval.itemRevision} (${esc(approval.confirmedAt || '')}). Snapshot SHA-256 ${short(approval.hash)} matches the current draft.</p>`;
    if (approval.state === 'stale') return `<p class="stale-box">Stale approval: the wording you confirmed (revision ${approval.itemRevision}, SHA-256 ${short(approval.hash)}) no longer matches the current draft (SHA-256 ${short(approval.currentHash)}). Confirm again to approve the current wording.</p>`;
    if (approval.state === 'superseded') return `<p class="stale-box">An earlier confirmation (revision ${approval.itemRevision}, SHA-256 ${short(approval.hash)}) was replaced by a later answer that is not a confirmation.</p>`;
    return `<p>Not yet approved. Confirming the owning question freezes exactly this wording (current SHA-256 ${short(approval.currentHash)}).</p>`;
  }
  function draftItem(entry, open) {
    return `<article class="draft-item"><h3><a href="#${entry.id}">${esc(entry.title)}</a></h3><span class="identity">${entry.id} · revision ${entry.revision} · ${esc(STATUS_LABEL[entry.derivedStatus] || entry.derivedStatus)} · ${esc(KIND_LABEL[entry.kind] || entry.kind)}</span>
      ${approvalLine(entry.approval)}
      <details ${open ? 'open' : ''}><summary>${entry.draftKind === 'full-text' ? 'Proposed wording · complete replacement text' : 'Proposed wording · excerpt, not a complete file'}</summary><div class="scroll-box reader">${markdown(entry.draft)}</div></details>
      <p><a href="#${entry.id}">Open the owning question to confirm or send it back</a></p></article>`;
  }
  async function renderDrafts(panel, serial) {
    panel.innerHTML = '<h1>Drafts to approve</h1><p>Reading proposed wording…</p>';
    const drafts = state.drafts || (state.drafts = await getJson('/api/drafts'));
    if (serial !== state.route) return;
    const count = drafts.groups.reduce((sum, group) => sum + group.items.length, 0);
    const stale = drafts.groups.flatMap(group => group.items).filter(entry => entry.approval.state === 'stale').length;
    panel.innerHTML = `<h1>Drafts to approve</h1>
      <p class="semantics">Each proposed wording sits beside the current text of the file it would change, tagged with the question that owns it. Confirming that question freezes exactly the wording shown, by SHA-256; a revised draft makes that approval visibly stale. Comments and change requests never approve.</p>
      <p>${count} drafts · ${drafts.groups.filter(group => group.target).length} target files · ${stale} stale approvals · ${drafts.withoutDraft.length} approval questions without a draft. <button class="bulk" type="button" id="refresh-drafts">Read again</button></p>
      ${drafts.groups.map(group => group.target ? `<section class="draft-group"><h2>${esc(catalogArtifact(group.target)?.title || group.target)}</h2><p class="reader-meta">${esc(group.target)}</p><div class="draft-comparison"><div><h3>Current text</h3><details data-current="${esc(group.target)}"><summary>Show the current text of this file</summary><div class="scroll-box reader" data-current-text>Not loaded.</div></details></div><div><h3>Proposed wording</h3>${group.items.map(entry => draftItem(entry, true)).join('')}</div></div></section>` : `<section class="draft-group"><h2>Proposed wording without one named target file</h2><p>These drafts are excerpts or proposals whose question does not name a single file they replace; read each question's sources for what they would change.</p>${group.items.map(entry => draftItem(entry, false)).join('')}</section>`).join('')}
      <section class="draft-group"><h2>No proposed draft available</h2><p>These questions ask for an approval but carry no proposed wording. None is invented; answer them from the question itself.</p><div class="artifact-list">${drafts.withoutDraft.map(entry => `<a href="#${entry.id}"><strong>${esc(entry.title)}</strong><small>${entry.id} · revision ${entry.revision} · ${esc(STATUS_LABEL[entry.derivedStatus] || entry.derivedStatus)} · ${esc(KIND_LABEL[entry.kind] || entry.kind)}</small></a>`).join('') || '<p>None.</p>'}</div></section>`;
    document.getElementById('refresh-drafts').onclick = () => { state.drafts = null; routePage(); };
    for (const details of panel.querySelectorAll('details[data-current]')) details.addEventListener('toggle', async () => {
      if (!details.open || details.dataset.loaded) return;
      details.dataset.loaded = 'yes';
      const target = details.querySelector('[data-current-text]');
      const file = details.dataset.current;
      try {
        if (catalogArtifact(file)) { const artifact = await getJson(`/api/artifact?path=${encodeURIComponent(file)}`); target.innerHTML = `<p class="reader-meta">Current checkout · SHA-256 ${esc(artifact.revision)}</p>${markdown(artifact.text, file)}`; }
        else { const read = await getJson(`/api/file?path=${encodeURIComponent(file)}`); target.innerHTML = `<p class="reader-meta">Current checkout</p>${markdown(read.text, file)}`; }
      } catch (error) { target.innerHTML = `<p class="error-box">The current text could not be read: ${esc(error.message)}</p>`; delete details.dataset.loaded; }
    });
  }

  // ---- Wiki. ----
  function renderWiki(panel) {
    const groups = state.catalog.groups.map(group => ({ ...group, count: state.catalog.artifacts.filter(artifact => artifact.group === group.id).length })).filter(group => group.count);
    panel.innerHTML = `<h1>Wiki</h1><p class="semantics">Root controls, decision records, Wiki pages, skills, Specs, Tasks and maintained knowledge, read from their owners. Every question that uses a decision record links here. ${state.glossary ? `Glossary terms show their definition on hover (from ${esc(state.glossary.source || 'no glossary file')}).` : 'Hover definitions are unavailable from this server.'}</p>
      <div class="group-grid">${groups.map(group => `<a class="group-card" href="#artifacts=${esc(group.id)}"><strong>${esc(group.title)}</strong><small>${group.count} ${group.count === 1 ? 'document' : 'documents'}</small></a>`).join('')}</div>
      ${state.catalog.errors?.length ? `<details><summary>${state.catalog.errors.length} sources could not be cataloged</summary>${state.catalog.errors.map(error => `<p class="error-box">${esc(error.source)}${error.path ? ` · ${esc(error.path)}` : ''}: ${esc(error.message)}</p>`).join('')}</details>` : ''}`;
  }
  function renderGroup(panel, group) {
    const selected = state.catalog.groups.find(candidate => candidate.id === group);
    if (!selected) throw new Error(`Unknown Wiki group ${group}`);
    const records = state.catalog.artifacts.filter(artifact => artifact.group === group).sort((a, b) => Number(b.status === 'accepted') - Number(a.status === 'accepted') || a.title.localeCompare(b.title));
    panel.innerHTML = `<p><a href="#section=wiki">← Wiki</a></p><h1>${esc(selected.title)}</h1><p>Titles first, identifiers second. Accepted decisions appear first; proposed and historical records stay available.</p><div class="section-filter"><label for="group-filter">Filter</label><input type="search" id="group-filter" placeholder="Title, ID or path"><span id="group-count">${records.length}</span></div><div class="artifact-list" id="group-list">${records.map(artifact => `<a href="${esc(artifactHref(artifact.path))}" data-filter="${esc(`${artifact.title} ${artifact.id || ''} ${artifact.path}`.toLowerCase())}"><strong>${esc(artifact.title)}</strong><small>${artifact.id ? `${esc(artifact.id)} · ` : ''}${esc(artifact.status)}</small><small>${esc(artifact.path)}</small></a>`).join('') || '<p>No records in this collection.</p>'}</div>`;
    document.getElementById('group-filter').oninput = event => {
      const q = event.target.value.toLowerCase(); let shown = 0;
      for (const link of panel.querySelectorAll('#group-list [data-filter]')) { link.hidden = q && !link.dataset.filter.includes(q); if (!link.hidden) shown += 1; }
      document.getElementById('group-count').textContent = String(shown);
    };
  }
  async function renderBacklinks(target, file) {
    try {
      const body = await getJson(`/api/backlinks?path=${encodeURIComponent(file)}`);
      const links = body.links || [];
      target.innerHTML = `<h2>Linked from</h2>${links.length ? `<ul>${links.map(link => `<li>${link.kind === 'question' ? `<a href="#${esc(link.id)}">${esc(link.title)}</a> <small>question · ${esc(link.id)}</small>` : `${sourceLink(link.path, link.title)} <small>${link.id ? esc(link.id) + ' · ' : ''}page</small>`}</li>`).join('')}</ul>` : '<p>No question or page links here.</p>'}`;
    } catch (error) {
      // Without the server backlinks route, show what the board itself knows.
      const citing = state.board.items.filter(item => item.sources.some(source => source.path === file));
      target.innerHTML = `<h2>Linked from</h2><p class="reader-meta">Page-to-page backlinks are unavailable from this server (${esc(error.message)}). Board questions that cite this file:</p>${citing.length ? `<ul>${citing.map(item => `<li><a href="#${item.id}">${esc(item.title)}</a> <small>${item.id}</small></li>`).join('')}</ul>` : '<p>None.</p>'}`;
    }
    wireViews(target);
  }
  async function renderArtifact(panel, file, params, serial) {
    panel.innerHTML = '<p>Reading the artifact…</p>';
    const artifact = await getJson(`/api/artifact?path=${encodeURIComponent(file)}`);
    if (serial !== state.route) return;
    state.artifact = artifact;
    const previous = state.revisions.get(file);
    state.revisions.set(file, artifact.revision);
    const itemId = params.get('item');
    const fullDrafts = artifact.related.filter(item => item.draftKind === 'full-text');
    const related = artifact.related.map(item => `<section class="artifact-section" id="draft-${item.id}"><h2>${esc(item.title)}</h2><p class="reader-meta">${item.id} · item revision ${item.revision} · ${esc(item.status)} · package captured ${esc(item.snapshotAt)} · item updated ${esc(item.itemUpdatedAt)}<br>Source at ${item.sources.map(source => esc(source.ref || 'unrecorded revision')).join(', ')}</p><p>${esc(item.question)}</p><a href="#${item.id}">Read and answer this question</a><h3>${item.draftKind === 'full-text' ? 'Proposed draft · full text' : item.draftKind === 'excerpt' ? 'Proposed draft · excerpt only' : 'Proposed change · no complete draft'}</h3><p>Review material; displaying it does not accept a change.${item.draftKind !== 'full-text' ? ' No complete replacement artifact is supplied by this item.' : ''}</p><div class="reader">${item.draft ? markdown(item.draft, file) : ''}<h3>Proposed change</h3>${markdown(item.proposal, file)}</div></section>`).join('');
    panel.innerHTML = `<p><a href="#section=wiki">← Wiki</a> · <a href="#artifacts=${esc(artifact.group)}">All ${esc(groupTitle(artifact.group))}</a></p><h1>${esc(artifact.title)}</h1><p class="reader-meta">${artifact.id ? `${esc(artifact.id)} · ` : ''}${esc(artifact.status)} · ${esc(artifact.path)}</p>
      <div id="source-change" class="source-change" ${previous && previous !== artifact.revision ? '' : 'hidden'}>The source changed since your previous reading. This is the current text; review snapshots below keep their own revisions. <button class="bulk" type="button" id="refresh-artifact">Read latest source</button></div>
      <div class="reader-tabs"><a href="${esc(artifactHref(file, 'current'))}">Current artifact</a><a href="${esc(artifactHref(file, 'proposals'))}">Drafts and proposed changes (${artifact.related.length})</a><a href="${esc(artifactHref(file, 'backlinks'))}">Linked from</a></div>
      <div class="draft-comparison"><section class="artifact-section" id="current-artifact"><h2>Current artifact</h2><p class="reader-meta">Current checkout · tree ${esc(artifact.tree || 'unavailable')}<br>Content SHA-256 ${esc(artifact.revision)} · read ${esc(artifact.readAt)}</p><div class="reader">${artifact.format === 'json' ? recordFields(JSON.parse(artifact.text), file) + `<details><summary>Complete source JSON</summary><pre>${esc(artifact.text)}</pre></details>` : markdown(artifact.text, file)}</div></section><section id="artifact-proposals"><h2>Available drafts and proposed changes</h2>${fullDrafts.length ? '' : '<p>No complete draft is available for this artifact. Existing proposed changes are shown without inventing a replacement.</p>'}${related || '<p>No linked proposals in the current review package.</p>'}</section></div>
      <section class="artifact-section" id="backlinks"><h2>Linked from</h2><p>Reading links…</p></section>`;
    document.getElementById('refresh-artifact').onclick = routePage;
    await renderBacklinks(document.getElementById('backlinks'), file);
    if (serial !== state.route) return;
    const anchor = params.get('anchor');
    const target = itemId ? document.getElementById(`draft-${itemId}`) : anchor === 'current' ? document.getElementById('current-artifact') : anchor === 'proposals' ? document.getElementById('artifact-proposals') : anchor === 'backlinks' ? document.getElementById('backlinks') : anchor ? [...panel.querySelectorAll('[data-anchor]')].find(element => element.dataset.anchor === anchor) : null;
    if (target) target.scrollIntoView({ block: 'start' }); else { window.scrollTo(0, 0); focusHeading(panel); }
  }

  // ---- Global search. ----
  function localSearch(query) {
    const q = query.toLowerCase();
    const questions = state.board.items.filter(item => `${item.id} ${item.title} ${item.question}`.toLowerCase().includes(q)).map(item => ({ kind: 'question', id: item.id, title: item.title, snippet: item.question, status: STATUS_LABEL[item.derivedStatus] }));
    const artifacts = state.catalog.artifacts.filter(artifact => `${artifact.id || ''} ${artifact.title} ${artifact.path}`.toLowerCase().includes(q)).map(artifact => ({ kind: groupTitle(artifact.group), id: artifact.id, path: artifact.path, title: artifact.title, snippet: artifact.path, status: artifact.status }));
    return [...questions, ...artifacts];
  }
  async function renderSearch(panel, query, serial) {
    document.getElementById('global-search').value = query;
    panel.innerHTML = `<h1>Search: ${esc(query)}</h1><p>Searching…</p>`;
    let results, note = '';
    try { results = (await getJson(`/api/search?q=${encodeURIComponent(query)}`)).results || []; }
    catch (error) { results = localSearch(query); note = `<p class="reader-meta">Full-text search is unavailable from this server (${esc(error.message)}); showing title and identifier matches only.</p>`; }
    if (serial !== state.route) return;
    panel.innerHTML = `<h1>Search: ${esc(query)}</h1>${note}<p>${results.length} results</p>${results.map(result => {
      const href = result.kind === 'question' && result.id ? `#${result.id}` : result.path ? (catalogArtifact(result.path) ? artifactHref(result.path) : '') : '';
      const title = href ? `<a href="${esc(href)}">${esc(result.title)}</a>` : result.path ? sourceLink(result.path, result.title) : esc(result.title);
      return `<div class="search-result"><strong>${title}</strong><span class="identity">${result.id ? `${esc(result.id)} · ` : ''}${esc(result.kind)}${result.status ? ` · ${esc(result.status)}` : ''}</span>${result.snippet ? `<p>${esc(result.snippet)}</p>` : ''}</div>`;
    }).join('') || '<p class="empty">Nothing matches.</p>'}`;
    wireViews(panel);
  }

  async function viewFile(relPath) {
    if (catalogArtifact(relPath)) { location.hash = artifactHref(relPath); return; }
    const dialog = document.getElementById('viewer');
    document.getElementById('viewer-path').textContent = relPath;
    document.getElementById('viewer-text').textContent = 'Loading…';
    dialog.showModal();
    try { document.getElementById('viewer-text').textContent = (await getJson(`/api/file?path=${encodeURIComponent(relPath)}`)).text; }
    catch (error) { document.getElementById('viewer-text').textContent = `Could not read: ${error.message}`; }
  }

  // ---- Hover definitions. ----
  function showTip(element) {
    const term = state.termIndex?.get(esc(element.dataset.term));
    const tip = document.getElementById('term-tip');
    if (!term) return;
    tip.innerHTML = `<strong>${esc(term.term)}</strong><br>${esc(term.definition)}<br><small>${esc(term.path || '')}</small>`;
    const rect = element.getBoundingClientRect();
    tip.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 380))}px`;
    tip.style.top = `${rect.bottom + 6}px`;
    tip.hidden = false;
  }
  function hideTip() { document.getElementById('term-tip').hidden = true; }
  for (const type of ['mouseover', 'focusin']) window.addEventListener(type, event => { const term = event.target?.closest?.('.term'); if (term) showTip(term); });
  for (const type of ['mouseout', 'focusout']) window.addEventListener(type, event => { if (event.target?.closest?.('.term')) hideTip(); });

  window.addEventListener('scroll', hideTip, { passive: true });
  window.addEventListener('hashchange', () => { hideTip(); routePage(); });
  document.getElementById('global-search-form').onsubmit = event => {
    event.preventDefault();
    const query = document.getElementById('global-search').value.trim();
    if (query) location.hash = `#${new URLSearchParams({ search: query })}`;
  };
  document.getElementById('search').oninput = event => { state.query = event.target.value.trim().toLowerCase(); state.inBatch = false; state.focus = null; state.picked.clear(); render(); };
  document.getElementById('reset-slice').onclick = () => { resetSlice(); render(); };
  document.getElementById('banner-reload').onclick = () => { if (!hasUnsavedWork() || confirm('You have unsaved notes or comments. Reload anyway?')) location.reload(); };
  document.getElementById('viewer-close').onclick = () => document.getElementById('viewer').close();
  document.getElementById('inspector-close').onclick = () => document.getElementById('inspector').close();
  document.getElementById('theme').onclick = () => {
    const root = document.documentElement;
    const current = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = current === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('grill-board-theme', root.dataset.theme); } catch {}
  };
  try { const saved = localStorage.getItem('grill-board-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch {}

  // Agents may add, revise or apply items while the page is open. Poll the
  // items file's modification time and offer a reload rather than redrawing
  // under the owner's hands.
  setInterval(async () => {
    if (!state.board) return;
    try {
      const status = await getJson('/api/status');
      if (status.itemsMtime !== state.board.itemsMtime) document.getElementById('banner').classList.add('show');
      if (state.artifact) {
        const viewed = state.artifact;
        const response = await fetch(`/api/artifact?path=${encodeURIComponent(viewed.path)}`, { cache: 'no-store' });
        const body = await response.json();
        if (state.artifact === viewed && (!response.ok || body.revision !== viewed.revision)) document.getElementById('source-change').hidden = false;
      }
    } catch {}
  }, 15000);

  window.addEventListener('beforeunload', (event) => { if (hasUnsavedWork()) { event.preventDefault(); event.returnValue = ''; } });

  Promise.all([load(), loadCatalog()]).then(async () => { await Promise.all([loadWorkflow(), loadGlossary()]); render(); return routePage(); }).catch((error) => { document.getElementById('content').innerHTML = `<div class="empty">Could not load the Dashboard: ${esc(error.message)}</div>`; });
})();
</script>
</body>
</html>
