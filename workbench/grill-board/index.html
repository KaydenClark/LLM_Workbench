<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Dashboard · Grill Board</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c19; --muted: #6b675e; --line: #e2dfd6;
    --accent: #3b5bdb; --accent-ink: #ffffff; --soft: #eef0fb;
    --ok: #2f8f5b; --ok-soft: #e6f4ec; --warn: #b7791f; --warn-soft: #fbf1dc; --bad: #c0392b; --bad-soft: #fbe7e4;
    --stale: #8e5bd6; --stale-soft: #f0e8fb; --applied: #2f6f8f; --applied-soft: #e3eff5;
    --p-bg: #f9dbd9; --p-ink: #a42c28; --v-bg: #fff0cb; --v-ink: #805600;
    --s1: #c9c4b8; --s2: #e0a84a; --s3: #3b5bdb; --s4: #5b8def; --s5: #8e5bd6; --s6: #2f8f5b; --s7: #2f6f8f; --s8: #1d6b42;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a; --panel: #1e2026; --ink: #ecebe6; --muted: #a39f94; --line: #2f323b;
      --accent: #7f97ff; --accent-ink: #0f1120; --soft: #232a44;
      --ok: #5cc48a; --ok-soft: #1d3328; --warn: #e0a84a; --warn-soft: #3a2e17; --bad: #ef7466; --bad-soft: #3d1f1b;
      --stale: #b793f2; --stale-soft: #2c2340; --applied: #7fb6d6; --applied-soft: #1b2c36;
      --p-bg: #4a1f1c; --p-ink: #ffb4ab; --v-bg: #43340f; --v-ink: #ffd88a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --panel: #1e2026; --ink: #ecebe6; --muted: #a39f94; --line: #2f323b;
    --accent: #7f97ff; --accent-ink: #0f1120; --soft: #232a44;
    --ok: #5cc48a; --ok-soft: #1d3328; --warn: #e0a84a; --warn-soft: #3a2e17; --bad: #ef7466; --bad-soft: #3d1f1b;
    --stale: #b793f2; --stale-soft: #2c2340; --applied: #7fb6d6; --applied-soft: #1b2c36;
    --p-bg: #4a1f1c; --p-ink: #ffb4ab; --v-bg: #43340f; --v-ink: #ffd88a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .term:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar: the five Dashboard sections and global search. */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 20px; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  .topbar .brand { font-weight: 700; font-size: 16px; margin-right: 4px; }
  .sections { display: flex; gap: 6px; flex-wrap: wrap; }
  .sections a { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; }
  .sections a:hover { background: var(--soft); }
  .sections a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .global-search { margin-left: auto; display: flex; gap: 6px; }
  .global-search input { width: min(280px, 60vw); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .theme { font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 8px; }

  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  .shell.wide { grid-template-columns: minmax(0, 1fr); }
  #grill-nav { position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 16px; }
  #grill-nav h1 { font-size: 17px; margin: 0 0 4px; }
  #grill-nav .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #grill-nav select, #grill-nav input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); padding: 7px 8px; border-radius: 8px; }
  .slice-label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; }
  .progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 8px 0 12px; }
  .progress span { display: block; height: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .nav-links { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
  main { padding: 20px 28px 80px; min-width: 0; }
  .shell:not(.wide) main { max-width: 1080px; }
  .banner { position: sticky; top: 64px; z-index: 5; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; }
  .banner.show { display: flex; }
  .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; color: var(--muted); font-size: 14px; }
  .notice strong { color: var(--ink); }
  .semantics { background: var(--soft); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 4px; }
  .bulk { font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 10px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 12px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .stale-box { margin-top: 10px; background: var(--stale-soft); border: 1px solid var(--stale); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .error-box { margin: 10px 0; background: var(--bad-soft); border: 1px solid var(--bad); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .applied-box { margin-top: 10px; background: var(--applied-soft); border: 1px solid var(--applied); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .ok-box { margin-top: 10px; background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 10px; padding: 8px 12px; font-size: 13px; }

  /* Grilling Board: topics, rows, badges and the central question. */
  .topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 20px 0; }
  .topic-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .topic-card h3 { margin: 0 0 8px; font-size: 17px; }
  .topic-card p { color: var(--muted); margin: 8px 0; font-size: 13px; }
  .topic-card progress, .batch-panel progress { width: 100%; accent-color: var(--ok); height: 8px; }
  .frame { font-size: 19px; line-height: 1.5; margin: 12px 0; }
  .lane-counts { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .slice-toolbar, .batch-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .slice-toolbar select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .batch-panel { background: var(--soft); border: 1px solid var(--accent); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; }
  .batch-panel h2 { font-size: 18px; margin: 0 0 8px; }
  .question-row { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .question-row .row-open { flex: 1; background: transparent; color: var(--ink); border: 0; text-align: left; padding: 4px; min-width: 0; }
  .question-row small { display: block; color: var(--muted); }
  .question-row.current { border-left: 3px solid var(--accent); padding-left: 8px; }
  .row-end { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; }
  .badge.pending { background: var(--soft); color: var(--accent); }
  .badge.answered { background: var(--ok-soft); color: var(--ok); }
  .badge.applied { background: var(--applied-soft); color: var(--applied); }
  .badge.stale { background: var(--stale-soft); color: var(--stale); }
  .badge.withdrawn, .badge.superseded { background: var(--line); color: var(--muted); }
  .grades { display: flex; gap: 6px; align-items: flex-start; }
  .grade { position: relative; font-size: 13px; }
  .grade summary { list-style: none; border-radius: 8px; padding: 4px 9px; cursor: pointer; font-weight: 700; }
  .grade summary::-webkit-details-marker { display: none; }
  .grade.priority summary, .grade-pill.priority { background: var(--p-bg); color: var(--p-ink); }
  .grade.value summary, .grade-pill.value { background: var(--v-bg); color: var(--v-ink); }
  .grade .grade-reason { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; width: min(320px, 80vw); background: var(--panel); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 13px; }
  .grade .grade-reason p { margin: 6px 0 0; }
  .grade.unclassified { color: var(--muted); font-size: 11px; border: 1px dashed var(--line); border-radius: 8px; padding: 3px 7px; white-space: nowrap; }
  .grade-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .grade-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
  .grade-card p { margin: 4px 0 0; font-size: 14px; }
  .grade-pill { font-weight: 700; border-radius: 8px; padding: 4px 9px; white-space: nowrap; }
  .grade-pill.none { background: var(--line); color: var(--muted); }
  #focus { margin-top: 24px; scroll-margin-top: 80px; }
  .question-context { color: var(--muted); font-size: 13px; }
  article.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 80px; }
  article.item[data-status="applied"] { border-color: var(--applied); }
  article.item[data-status="answered"] { border-color: var(--ok); }
  article.item[data-status="stale"] { border-color: var(--stale); }
  article.item[data-status="withdrawn"] { opacity: .6; }
  .item-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .item-head h3 { margin: 0; font-size: 18px; line-height: 1.35; }
  .identity { display: block; color: var(--muted); font: 12px var(--mono); margin-top: 6px; font-weight: normal; }
  .kind { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .q { font-weight: 600; margin: 10px 0 12px; }
  .block { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 12px 0; }
  .block h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .block p { margin: 0 0 8px; } .block p:last-child { margin-bottom: 0; }
  .block ul, .block ol { margin: 0 0 8px; padding-left: 20px; }
  .block pre { white-space: pre-wrap; word-break: break-word; font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
  .block code { font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .block h1, .block h2, .block h3 { font-size: 14px; margin: 10px 0 4px; }
  .brief-summary { font-size: 17px; line-height: 1.6; }
  .recommendation { border-left: 4px solid var(--accent); background: var(--soft); padding: 10px 18px; margin: 16px 0; border-radius: 4px; }
  .recommendation h4 { margin: 0 0 6px; font-size: 13px; }
  .recommendation p { margin: 0; }
  details.draft { margin-top: 12px; }
  details.draft summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  details.draft .block { max-height: 70vh; overflow: auto; }
  .history-entry { margin: 10px 0; background: var(--bg); padding: 12px; border-radius: 8px; }
  .history-entry summary { cursor: pointer; font-size: 14px; }
  .sources { margin: 12px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .sources a, .sources button, .link-button { color: var(--accent); background: none; border: 0; padding: 0; font-size: inherit; text-decoration: underline; }
  .wiki-links { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0; font-size: 13px; }

  /* Answer controls. */
  .answer { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .answer h4 { margin: 0 0 8px; font-size: 15px; }
  .answer textarea, .card-workflow textarea { width: 100%; min-height: 72px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  .alternatives { display: grid; gap: 6px; margin: 10px 0; }
  .alternatives .opt { text-align: left; }
  .answer-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .opt { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 12px; font-size: 14px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .opt[data-role="confirm"] { font-weight: 700; }
  .opt[data-role="sendback"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .opt small { display: block; font-weight: normal; opacity: .8; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .save { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .save .err, .err { color: var(--bad); }
  .legacy-answer { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 8px 0; }

  /* Comments, rounds and promotion. */
  .round-workflow { padding: 16px 20px; margin-bottom: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .round-workflow h2 { margin: 0 0 6px; font-size: 18px; }
  .card-workflow { padding: 14px 0 0; margin-top: 14px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .card-workflow h4 { margin: 0 0 8px; }
  .request { padding: 10px 12px; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
  .timeline { list-style: none; padding: 0; margin: 10px 0; border-left: 2px solid var(--line); }
  .timeline li { position: relative; padding: 4px 0 10px 18px; font-size: 13.5px; }
  .timeline li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); }
  .timeline li.done::before { background: var(--ok); border-color: var(--ok); }
  .timeline li.next::before { border-color: var(--accent); }
  .timeline small { display: block; color: var(--muted); }
  .confirmed-list { display: grid; gap: 4px; margin: 8px 0; max-height: 260px; overflow: auto; }

  /* Sections, reader, inspector. */
  .reader { font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; max-width: 82ch; }
  .reader h1 { font-size: 26px; line-height: 1.3; }
  .reader h2 { font-size: 21px; margin-top: 28px; }
  .reader h3 { font-size: 17px; }
  .reader pre { white-space: pre-wrap; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 13px/1.6 var(--mono); }
  .reader code { font-family: var(--mono); font-size: .86em; }
  .reader blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--line); }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--soft); }
  .reader-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .reader-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .reader-tabs a, .artifact-list a, .group-card { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--panel); text-decoration: none; color: var(--ink); }
  .artifact-list { display: grid; gap: 8px; margin: 16px 0; }
  .artifact-list small, .group-card small { display: block; color: var(--muted); }
  .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 16px 0; }
  .artifact-section { padding: 20px; margin: 20px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); scroll-margin-top: 80px; }
  .artifact-section > h2 { margin-top: 0; }
  .source-change { padding: 12px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; margin: 12px 0; }
  .unavailable-link { color: var(--muted); text-decoration: underline dotted; }
  .draft-comparison { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; }
  .draft-group { padding: 18px 20px; margin: 18px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .draft-group h2 { margin: 0; font-size: 19px; }
  .draft-item { border-top: 1px solid var(--line); padding: 12px 0; }
  .draft-item h3 { margin: 0; font-size: 16px; }
  .scroll-box { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--bg); }
  .lanes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .lane h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .source-card { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; }
  .source-card small { display: block; color: var(--muted); margin-top: 4px; }
  .landmark-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .landmark-card h3 { margin: 0; font-size: 17px; }
  .distribution { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin: 8px 0; }
  .distribution span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button { font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 2px 9px; }
  .section-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .section-filter input, .section-filter select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .why-row { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--panel); }
  .why-row h3 { margin: 0; font-size: 16px; }
  .why-row blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--warn); }
  .search-result { border-bottom: 1px solid var(--line); padding: 10px 0; }
  dialog { width: min(1000px, 94vw); max-height: 90vh; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  dialog header h2 { margin: 0; font-size: 19px; }
  dialog .dialog-body { padding: 14px 18px; overflow: auto; max-height: calc(90vh - 80px); }
  dialog pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px var(--mono); }
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; margin: 0 0 12px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .term { text-decoration: underline dotted; text-underline-offset: 3px; color: inherit; cursor: help; }
  #term-tip { position: fixed; z-index: 20; max-width: 360px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.15); pointer-events: none; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    #grill-nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    .topbar { position: static; }
    .global-search { margin-left: 0; }
    .draft-comparison, .grade-detail, .topic-grid { grid-template-columns: 1fr; }
    .question-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Workbench Dashboard</span>
  <nav class="sections" id="section-tabs" aria-label="Dashboard sections">
    <a href="#section=tracker" data-section="tracker">Destination Tracker</a>
    <a href="#section=taskboard" data-section="taskboard">Taskboard</a>
    <a href="#section=grilling" data-section="grilling">Grilling Board</a>
    <a href="#section=drafts" data-section="drafts">Drafts to approve</a>

  <form class="global-search" id="global-search-form" role="search">

</header>
<div class="shell" id="shell">
  <nav id="grill-nav" aria-label="Grilling Board filters">
    <h1>Grilling Board</h1>
    <div class="meta" id="meta">loading…</div>
    <div class="progress" id="progress" title="applied / answered"></div>
    <label class="slice-label" for="intent">What do you feel like doing?</label>
    <select id="intent"><option value="all">Anything</option><option value="unblock">Unblock / direct work</option><option value="explore">Explore / settle decisions</option><option value="review">Review existing work</option></select>
    <label class="slice-label" for="topic">Think about…</label><select id="topic"></select>
    <label class="slice-label" for="scope">At what scale?</label>
    <select id="scope"><option value="all">Any scale</option><option value="BLUEPRINT">Blueprint · whole product</option><option value="LANDMARK">Landmark · a direction</option><option value="SPEC">Spec · one capability</option><option value="TASK">Task · one step</option></select>
    <label class="slice-label" for="priority-filter">Priority</label>
    <select id="priority-filter"><option value="all">All Priorities</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="P4">P4</option><option value="unclassified">Unclassified</option></select>
    <label class="slice-label" for="value-filter">Value</label>
    <select id="value-filter"><option value="all">All Values</option><option value="V1">V1</option><option value="V2">V2</option><option value="V3">V3</option><option value="V4">V4</option><option value="unclassified">Unclassified</option></select>
    <span class="slice-label">Where is it in the workflow?</span>
    <div class="filters" id="filters"></div>
    <label class="slice-label" for="search">Search these questions</label>
    <input type="search" id="search" placeholder="Titles, questions, text…">
    <p><button class="bulk" id="reset-slice" type="button">Clear all filters</button></p>
    <div class="nav-links"><a href="#section=whys" id="whys-link">Whys list</a><a href="#section=drafts">Drafts to approve</a></div>
  </nav>
  <main id="main">
    <div class="banner" id="banner" role="status"><span>An agent updated the board since you loaded it. Your saved answers are safe.</span><button class="bulk" type="button" id="banner-reload">Reload</button></div>
    <div id="questions-panel">
      <div id="round-workflow" class="round-workflow"></div>

<dialog id="viewer" aria-labelledby="viewer-path"><header><h2 id="viewer-path"></h2><button class="bulk" type="button" id="viewer-close">Close</button></header><div class="dialog-body"><pre id="viewer-text"></pre></div></dialog>

<div id="term-tip" role="tooltip" hidden></div>
<script>
(() => {
  const STATUS_LABEL = { pending: 'Pending', stale: 'Re-answer', answered: 'Answered', applied: 'Applied', withdrawn: 'Withdrawn', superseded: 'Superseded' };
  const SECTIONS = { tracker: 'Destination Tracker', taskboard: 'Taskboard', grilling: 'Grilling Board', drafts: 'Drafts to approve', wiki: 'Wiki' };
  const KIND_LABEL = { 'approve-spec': 'Delivery approval', 'confirm-dqc': 'Confirm understanding', 'confirm-ddr': 'Review existing decision', 'confirm-text': 'Review draft text', choice: 'Choose a direction', 'owner-decision': 'Unblock work' };
  const LANE_TITLES = { backlog: 'Backlog', toDo: 'To do', inProgress: 'In progress', blocked: 'Blocked', needsReview: 'Needs review', complete: 'Complete' };
  const STEP_COLORS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
  const state = {
    board: null, catalog: null, workflow: null, workflowError: '', dashboard: null, drafts: null, glossary: null,
    termIndex: null, termPattern: null, termSeen: null,
    edits: new Map(), comments: new Map(), errors: new Map(), inflight: new Map(), timers: new Map(), selected: new Map(), actions: new Map(),
    query: '', topic: 'all', intent: 'all', scope: 'all', lane: 'all', priority: 'all', value: 'all',
    focus: null, picked: new Set(), promote: new Set(), batch: null, inBatch: false, size: 5,
    route: 0, revisions: new Map(), artifact: null, view: 'grilling', questionScroll: 0, whyQuery: '', whyStatus: 'all'
  };
  try {
    const saved = JSON.parse(localStorage.getItem('grill-board-batch'));
    if (saved && Array.isArray(saved.ids) && saved.ids.length && saved.ids.every(id => typeof id === 'string') && saved.revisions && typeof saved.title === 'string') { state.batch = saved; state.inBatch = true; }
  } catch {}

  // Navigation metadata for this review package, not new answers or landmark records.
  // Unknown additions remain visible in Other topics until deliberately grouped.
  const TOPICS = [
    { id: 'direction', title: 'Purpose & boundaries', frame: 'what the Workbench is, whom it serves, and what belongs outside it', outcome: 'A clear destination and limits for the product.', numbers: [17,31,32,33,34,37,47,48,49,51,53,54,56,57,74,75,81,144,160,161,173,174,178,179] },
    { id: 'workflow', title: 'From idea to delivered work', frame: 'how an idea becomes work, how it moves, and what done means', outcome: 'Clear transitions, proof, approval and cleanup.', numbers: [1,2,6,8,9,20,26,35,36,46,55,58,65,66,72,79,80,82,83,84,85,88,99,101,103,105,106,115,121,122,124,125,127,128,129,130,132,133,142,143,145,146,147,148,159] },
    { id: 'roles', title: 'People, agents & responsibility', frame: 'who owns a job, who may delegate, and who checks the result', outcome: 'Distinct jobs and trustworthy handoffs between roles.', numbers: [14,15,28,63,67,86,87,134,135,136,137,138] },
    { id: 'context', title: 'Instructions, knowledge & memory', frame: 'what agents must obey, what they need to read, and what must survive a chat', outcome: 'The right context reaches the next agent without losing your intent.', numbers: [5,16,18,38,39,40,44,59,64,89,94,95,96,97,118,120,131,140,158,163,164,165,171,176,181] },
    { id: 'records', title: 'Maps, records & shared language', frame: 'how decisions, question cards, landmarks, Specs and names fit together', outcome: 'A readable map from your questions to decisions and delivery.', numbers: [4,10,11,13,27,29,60,62,78,90,91,92,93,102,107,108,110,111,112,139,141,166,167,168,169,170,172,177,180] },
    { id: 'tools', title: 'Tools, skills & everyday use', frame: 'the actions an agent or owner takes and how those actions should behave', outcome: 'Small, dependable actions with clear inputs and results.', numbers: [7,12,19,43,45,52,61,73,76,77,98,100,113,116,117,119,123,126,155,156,157,162,175] },
    { id: 'coordination', title: 'Shared work & connected rooms', frame: 'how agents share work across GitHub, devices and rooms', outcome: 'Reliable coordination, access and recovery without conflicting writers.', numbers: [3,22,23,25,30,41,42,68,69,70,71,109,114,154] },
    { id: 'release', title: 'Releases, upgrades & proof', frame: 'what should ship, where it is proven, and what an upgrade preserves', outcome: 'A release demonstrated in a real project with remaining gaps visible.', numbers: [21,24,50,104,149,150,151,152,153] },
    { id: 'other', title: 'Other topics', frame: 'the context and consequence of a newly added question', outcome: 'New questions stay reachable while their topic is being organized.', numbers: [] }
  ];
  const LANES = { all: 'All stages', pending: 'To answer', stale: 'Revisit', answered: 'Answered · awaiting an agent', applied: 'Applied', parked: 'Not now (earlier answers)', withdrawn: 'Withdrawn' };
  const INTENTS = { all: 'Any kind of decision', unblock: 'Unblock / direct work', explore: 'Explore / settle decisions', review: 'Review existing work' };

  // ---- Slice model: pure functions the tests load directly. ----
  function topicFor(item) { return TOPICS.find(topic => topic.numbers.includes(Number(item.id?.replace('GB-', ''))))?.id || 'other'; }
  function intentFor(item) {
    if (item.id === 'GB-0180' || ['approve-spec', 'confirm-ddr', 'confirm-text', 'confirm-dqc'].includes(item.kind)) return 'review';
    return item.kind === 'owner-decision' ? 'unblock' : 'explore';
  }
  // A legacy Not now answer at the current revision stays parked, still unanswered.
  function laneFor(item) {
    return item.derivedStatus === 'pending' && item.answer?.itemRevision === item.revision && item.answer?.verdict === 'defer' ? 'parked' : item.derivedStatus;
  }
  function sliceCounts(items) {
    const counts = { pending: 0, stale: 0, answered: 0, applied: 0, parked: 0, withdrawn: 0 };
    for (const item of items) counts[laneFor(item)] += 1;
    return counts;
  }
  // Priority and Value filter independently: P alone spans every Value, V
  // alone every Priority, both select their intersection. Never a combined score.
  function matchesSlice(item, slice = state) {
    if (slice.priority && slice.priority !== 'all' && (item.priority?.grade || 'unclassified') !== slice.priority) return false;
    if (slice.value && slice.value !== 'all' && (item.value?.grade || 'unclassified') !== slice.value) return false;
    if (slice.topic && slice.topic !== 'all' && topicFor(item) !== slice.topic) return false;
    if (slice.intent && slice.intent !== 'all' && intentFor(item) !== slice.intent) return false;
    if (slice.scope && slice.scope !== 'all' && item.brief?.scope !== slice.scope) return false;
    if (slice.lane && slice.lane !== 'all' && laneFor(item) !== slice.lane) return false;
    const hay = `${JSON.stringify(item.brief || {})} ${item.id} ${item.title} ${item.question} ${item.current} ${item.proposal} ${item.draft ?? ''} ${(item.tags || []).join(' ')}`.toLowerCase();
    return !slice.query || hay.includes(slice.query);
  }
  function sliceTitle(slice = state) {
    const parts = [TOPICS.find(topic => topic.id === slice.topic)?.title || 'All topics', INTENTS[slice.intent] || INTENTS.all];
    if (slice.priority && slice.priority !== 'all') parts.push(slice.priority === 'unclassified' ? 'Priority unclassified' : slice.priority);
    if (slice.value && slice.value !== 'all') parts.push(slice.value === 'unclassified' ? 'Value unclassified' : slice.value);
    if (slice.lane && slice.lane !== 'all') parts.push(LANES[slice.lane]);
    if (slice.query) parts.push(`“${slice.query}”`);
    return parts.join(' · ');
  }
  // Topic navigation counts and opens only the members matching the other
  // filters. It reports counts only: no topic carries a P/V grade of its own.
  function topicSummaries(items, slice = state) {
    return TOPICS.map(topic => {
      const members = items.filter(item => topicFor(item) === topic.id && matchesSlice(item, { ...slice, topic: 'all' }));
      const counts = sliceCounts(members);
      return { id: topic.id, title: topic.title, frame: topic.frame, outcome: topic.outcome, members: members.map(item => item.id), done: counts.answered + counts.applied, total: members.length - counts.withdrawn, counts };
    }).filter(topic => topic.members.length);
  }
  function batchProgress() {
    const ids = state.batch?.ids || [];
    const items = ids.map(id => state.board.items.find(item => item.id === id));
    const done = items.filter(item => item && ['answered', 'applied'].includes(item.derivedStatus) && !state.edits.has(item.id)).length;
    const withdrawn = items.filter(item => item?.derivedStatus === 'withdrawn').length;
    return { total: ids.length, done, withdrawn, complete: ids.length > 0 && done + withdrawn === ids.length };
  }
  function persistBatch() { try { if (state.batch) localStorage.setItem('grill-board-batch', JSON.stringify(state.batch)); else localStorage.removeItem('grill-board-batch'); } catch {} }
  function startBatch(items) {
    if (!items.length) return;
    // A fixed membership never grows, shrinks or regrades as answers are saved
    // or filters change. Replacing a batch requires an explicit click.
    state.batch = { ids: items.map(item => item.id), revisions: Object.fromEntries(items.map(item => [item.id, item.revision])), title: sliceTitle() };
    state.inBatch = true; state.focus = items[0].id; state.picked.clear(); persistBatch(); render();
  }
  function batchItems() { return (state.batch?.ids || []).map(id => state.board.items.find(item => item.id === id)).filter(Boolean); }
  function visible(item) { return state.inBatch ? Boolean(state.batch?.ids.includes(item.id)) : matchesSlice(item); }
  function shownItems() { return state.inBatch ? batchItems() : state.board.items.filter(visible); }

  // Change the why answers, current and earlier, filterable by text and status.
  function whysList(items, filter = {}) {
    const rows = [];
    for (const item of items) {
      const answer = item.answer;
      if (!answer) continue;
      if (answer.verdict === 'change_why') rows.push({ id: item.id, title: item.title, note: answer.note, itemRevision: answer.itemRevision, revision: item.revision, status: item.derivedStatus, at: answer.at, current: true });
      for (const earlier of answer.history || []) if (earlier.verdict === 'change_why') rows.push({ id: item.id, title: item.title, note: earlier.note, itemRevision: earlier.itemRevision, revision: item.revision, status: 'superseded', at: earlier.at, current: false });
    }
    const query = String(filter.query || '').trim().toLowerCase();
    return rows
      .filter(row => !filter.status || filter.status === 'all' || row.status === filter.status)
      .filter(row => !query || `${row.title} ${row.id} ${row.note}`.toLowerCase().includes(query))
      .sort((a, b) => String(b.at).localeCompare(String(a.at)));
  }

  // The answer buttons for one question, from the server's answerControls
  // (item.controls) and the note typed so far. Every answer except confirming
  // the recommended one is disabled until a note is typed.
  function answerModel(item, edit) {
    const controls = item.controls;
    const answer = edit || item.answer || { verdict: '', note: '' };
    const hasNote = Boolean(String(answer.note || '').trim());
    const known = controls.options.some(option => option.value === answer.verdict);
    let selected = null;
    if (controls.mode === 'alternatives') {
      selected = state.selected.get(item.id) ?? (controls.alternatives.some(alt => alt.value === answer.verdict) ? answer.verdict : controls.recommended);
    }
    const selectedAlternative = controls.alternatives.find(alt => alt.value === selected) || null;
    const buttons = controls.alternatives.map(alt => ({
      role: 'alternative', value: alt.value, label: `${alt.marker}: ${alt.label}`, hint: alt.hint || '',
      pressed: alt.value === selected, disabled: alt.requiresNote && !hasNote, requiresNote: alt.requiresNote
    }));
    const confirmValue = controls.mode === 'alternatives' ? (selectedAlternative?.value ?? null) : controls.confirm.value;
    const confirmNeedsNote = controls.mode === 'alternatives' && Boolean(selectedAlternative?.requiresNote);
    buttons.push({
      role: 'confirm', value: confirmValue, label: 'Confirm',
      hint: controls.mode === 'alternatives' ? (selectedAlternative ? `Confirms “${selectedAlternative.label}”.` : 'Select an answer above, then Confirm.') : controls.confirm.hint,
      pressed: Boolean(confirmValue) && answer.verdict === confirmValue, disabled: !confirmValue || (confirmNeedsNote && !hasNote), requiresNote: confirmNeedsNote
    });
    for (const option of controls.sendBack) buttons.push({ role: 'sendback', value: option.value, label: option.label, hint: option.hint, pressed: answer.verdict === option.value, disabled: !hasNote, requiresNote: true });
    return {
      mode: controls.mode, buttons, selected, hasNote,
      legacy: answer.verdict && !known ? { verdict: answer.verdict, label: (item.answer?.verdict === answer.verdict && item.answerLabel) || answer.verdict } : null,
      recommendationBasis: controls.recommendationBasis
    };
  }

  // The workflow's own per-card state (GET /api/workflow cards[id]); the page
  // renders it and never re-derives promotion state.
  function cardState(item) { return state.workflow?.cards?.[item.id] || null; }
  // Cards that may be promoted now: the workflow reports them confirmed (a
  // current exact confirmation with no Change awaiting revision and no request
  // for the same approved bytes), and the owner has no unsaved edit on them.
  function confirmedItems() {
    return state.board.items.filter(item => cardState(item)?.state === 'confirmed' && !state.edits.has(item.id));
  }

  const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Glossary terms become hover definitions: the first use per rendered text.
  function withTerms(html) {
    if (!state.termPattern || !state.termSeen) return html;
    return html.replace(state.termPattern, match => {
      const term = state.termIndex.get(match);
      if (!term || state.termSeen.has(term.term)) return match;
      state.termSeen.add(term.term);
      return `<a class="term" href="${esc(artifactHref(term.path, term.anchor))}" data-term="${esc(term.term)}">${match}</a>`;
    });
  }

  // A deliberately small Markdown renderer: paragraphs, headings, lists,
  // quotes, tables, fenced code, inline code, bold and links. Everything else is text.
  function inline(text, source = '') {
    const token = /`([^`]+)`|\[([^\]]+)\]\(([^\s)]+)\)/g;
    let result = '', start = 0;
    const plain = (value, terms = true) => (terms ? withTerms(esc(value)) : esc(value)).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    for (const match of String(text).matchAll(token)) {
      result += plain(String(text).slice(start, match.index));
      if (match[1] !== undefined) result += `<code>${esc(match[1])}</code>`;
      else {
        const label = plain(match[2], false), target = match[3];
        if (/^https?:\/\//i.test(target)) result += `<a href="${esc(target)}" target="_blank" rel="noopener">${label}</a>`;
        else if (source && !/^[a-z][a-z\d+.-]*:/i.test(target)) {
          try {
            const url = new URL(target, `http://reader/${source}`);
            const local = decodeURIComponent(url.pathname.slice(1));
            const artifact = state.catalog?.artifacts.find(a => a.path === local);
            result += artifact ? `<a href="${esc(artifactHref(local, url.hash.slice(1)))}">${label}</a>` : `<span class="unavailable-link" title="Not a Wiki artifact: ${esc(local)}">${label}</span>`;
          } catch { result += label; }
        } else result += label;
      }
      start = match.index + match[0].length;
    }
    return result + plain(String(text).slice(start));
  }
  function markdown(text, source = '', depth = 0) {
    if (depth === 0) state.termSeen = state.termPattern ? new Set() : null;
    const lines = String(text ?? '').replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      if (/^---\s*$/.test(line) && i === 0) {
        const buf = [];
        i += 1;
        while (i < lines.length && !/^---\s*$/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      if (/^\|/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\|/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        const cells = row => row.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(cell => inline(cell.trim().replace(/\\\|/g, '|'), source));
        if (buf.length > 1 && /^\|?[\s:|-]+\|?\s*$/.test(buf[1])) {
          out.push(`<div class="table-scroll"><table><thead><tr>${cells(buf[0]).map(cell => `<th>${cell}</th>`).join('')}</tr></thead><tbody>${buf.slice(2).map(row => `<tr>${cells(row).map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        } else out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) { const level = heading[1].length; const anchor = heading[2].toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-'); out.push(`<h${level} data-anchor="${esc(anchor)}">${inline(heading[2], source)}</h${level}>`); i += 1; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const buf = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
          let item = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '');
          i += 1;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) { item += ' ' + lines[i].trim(); i += 1; }
          buf.push(`<li>${inline(item, source)}</li>`);
        }
        out.push(`<${ordered ? 'ol' : 'ul'}>${buf.join('')}</${ordered ? 'ol' : 'ul'}>`);
        continue;
      }
      if (/^>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i += 1; }
        out.push(`<blockquote>${markdown(buf.join('\n'), source, depth + 1)}</blockquote>`);
        continue;
      }
      if (!line.trim()) { i += 1; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|>|\s*([-*]|\d+\.)\s+|\|)/.test(lines[i])) { buf.push(lines[i]); i += 1; }
      out.push(`<p>${inline(buf.join(' '), source)}</p>`);
    }
    return out.join('');
  }
  function recordFields(value, source, depth = 2) {
    if (Array.isArray(value)) return value.length ? value.map((entry, index) => `<section><h${Math.min(6, depth)}>Entry ${index + 1}</h${Math.min(6, depth)}>${recordFields(entry, source, depth + 1)}</section>`).join('') : '<p>None recorded.</p>';
    if (value && typeof value === 'object') return Object.entries(value).map(([key, entry]) => `<section><h${Math.min(6, depth)}>${esc(key.replace(/_/g, ' '))}</h${Math.min(6, depth)}>${recordFields(entry, source, depth + 1)}</section>`).join('');
    return typeof value === 'string' ? markdown(value, source, depth) : `<p>${esc(value === null ? 'null' : value)}</p>`;
  }
  function artifactHref(file, anchor = '', item = '') {
    const params = new URLSearchParams({ artifact: file });
    if (anchor) params.set('anchor', anchor);
    if (item) params.set('item', item);
    return `#${params}`;
  }
  function catalogArtifact(file) { return state.catalog?.artifacts.find(artifact => artifact.path === file) || null; }
  function groupTitle(id) { return state.catalog?.groups.find(group => group.id === id)?.title || id; }
  // A link to a source: the Wiki reader for cataloged artifacts, the plain
  // viewer for other named board sources, an external link for https.
  function sourceLink(reference, label) {
    const target = typeof reference === 'string' ? reference : reference?.path || reference?.url || '';

  // ---- Loading. ----

  async function load() { state.board = await getJson('/api/board'); }

  async function loadGlossary() {

      state.termIndex = new Map(terms.map(term => [esc(term.term), term]));

  // ---- Grilling Board. ----

  function resetSlice() {

  function renderNavigation() {

  function renderBatchProgress() {

  function renderOverview() {

  function gradeBadges(item) {

  // The latest answer-to-card P/V reassessment recorded in item history, or

  function render() {

  // Opening a question records it in the address without a navigation, so a

  // Decision records and other cataloged sources open in the Wiki section.

    if (!links.length) return '';
    return `<div class="wiki-links"><span>Read in the Wiki:</span>${links.map(({ source, artifact }) => `<a href="${esc(artifactHref(source.path, '', item.id))}">${esc(groupTitle(artifact.group))} · ${esc(artifact.title)}</a>`).join('')}</div>`;

  function card(item) {
