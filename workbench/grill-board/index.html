<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consequential Decisions · Grill Board</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c19; --muted: #6b675e; --line: #e2dfd6;
    --accent: #3b5bdb; --accent-ink: #ffffff; --soft: #eef0fb;
    --ok: #2f8f5b; --ok-soft: #e6f4ec; --warn: #b7791f; --warn-soft: #fbf1dc; --bad: #c0392b; --bad-soft: #fbe7e4;
    --stale: #8e5bd6; --stale-soft: #f0e8fb; --applied: #2f6f8f; --applied-soft: #e3eff5;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a; --panel: #1e2026; --ink: #ecebe6; --muted: #a39f94; --line: #2f323b;
      --accent: #7f97ff; --accent-ink: #0f1120; --soft: #232a44;
      --ok: #5cc48a; --ok-soft: #1d3328; --warn: #e0a84a; --warn-soft: #3a2e17; --bad: #ef7466; --bad-soft: #3d1f1b;
      --stale: #b793f2; --stale-soft: #2c2340; --applied: #7fb6d6; --applied-soft: #1b2c36;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --panel: #1e2026; --ink: #ecebe6; --muted: #a39f94; --line: #2f323b;
    --accent: #7f97ff; --accent-ink: #0f1120; --soft: #232a44;
    --ok: #5cc48a; --ok-soft: #1d3328; --warn: #e0a84a; --warn-soft: #3a2e17; --bad: #ef7466; --bad-soft: #3d1f1b;
    --stale: #b793f2; --stale-soft: #2c2340; --applied: #7fb6d6; --applied-soft: #1b2c36;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 16px; }
  nav h1 { font-size: 17px; margin: 0 0 4px; }
  nav .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 8px 0 14px; }
  .progress span { display: block; height: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  nav input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-bottom: 14px; }
  .groups a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13px; }
  .groups a:hover { background: var(--soft); }
  .groups a small { color: var(--muted); white-space: nowrap; }
  main { padding: 20px 28px 80px; max-width: 1060px; }
  .banner { position: sticky; top: 0; z-index: 5; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; }
  .banner.show { display: flex; }
  .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; color: var(--muted); font-size: 14px; }
  .notice strong { color: var(--ink); }
  section.group { margin: 0 0 36px; }
  section.group > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  section.group h2 { font-size: 20px; margin: 0; }
  section.group .intro { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .bulk { font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 4px 10px; }
  article.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  article.item[data-status="applied"] { border-color: var(--applied); }
  article.item[data-status="answered"] { border-color: var(--ok); }
  article.item[data-status="stale"] { border-color: var(--stale); }
  article.item[data-status="withdrawn"] { opacity: .6; }
  .item-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .item-head h3 { margin: 0; font-size: 16px; line-height: 1.35; }
  .item-head .id { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; }
  .badge.pending { background: var(--soft); color: var(--accent); }
  .badge.answered { background: var(--ok-soft); color: var(--ok); }
  .badge.applied { background: var(--applied-soft); color: var(--applied); }
  .badge.stale { background: var(--stale-soft); color: var(--stale); }
  .badge.withdrawn { background: var(--line); color: var(--muted); }
  .kind { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .q { font-weight: 600; margin: 10px 0 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .shell { grid-template-columns: 1fr; } nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }
  .block { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .block h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .block p { margin: 0 0 8px; } .block p:last-child { margin-bottom: 0; }
  .block ul, .block ol { margin: 0 0 8px; padding-left: 20px; }
  .block pre { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
  .block code { font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .block blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .block h1, .block h2, .block h3 { font-size: 14px; margin: 10px 0 4px; }
  details.draft { margin-top: 12px; }
  details.draft summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  details.draft .block { margin-top: 8px; max-height: 70vh; overflow: auto; }
  .sources { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .sources a, .sources button { color: var(--accent); background: none; border: 0; padding: 0; font-size: 12.5px; text-decoration: underline; }
  .answer { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .opt { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .opt[data-value="decline"][aria-pressed="true"], .opt[data-value="drop"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt[data-value="correct"][aria-pressed="true"], .opt[data-value="finding"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  textarea.needs-note { border-color: var(--warn); }
  .save { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .save .err { color: var(--bad); }
  .applied-box { margin-top: 10px; background: var(--applied-soft); border: 1px solid var(--applied); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .stale-box { margin-top: 10px; background: var(--stale-soft); border: 1px solid var(--stale); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  dialog { width: min(1000px, 92vw); max-height: 88vh; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; }
  dialog header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
  dialog pre { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; max-height: 76vh; overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .theme { font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 2px 8px; margin-top: 12px; }
  .block { margin: 12px 0; }
  .block h4, .recommendation h4 { font-size: 13px; text-transform: none; letter-spacing: 0; }
  .brief-summary { font-size: 17px; line-height: 1.6; }
  .recommendation { border-left: 4px solid var(--accent); background: var(--soft); padding: 10px 18px; margin: 16px 0; border-radius: 4px; }
  .recommendation h4 { margin: 0 0 6px; }
  .recommendation p { margin: 0; }
  .identity { display: block; color: var(--muted); font: 11px var(--mono); margin-top: 8px; font-weight: normal; }
  .options { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
  .option-impact { font-size: 13px; color: var(--muted); }
  .history-entry { margin: 10px 0; background: var(--bg); padding: 12px; border-radius: 8px; }
  .history-entry summary { cursor: pointer; font-size: 14px; }
  .history-entry p { line-height: 1.65; }
  .family { margin: 24px 0 14px; font-weight: 500; color: var(--muted); }
  .family small { font-size: 12px; }
  [hidden] { display: none !important; }
  .page-header { position: sticky; top: 0; z-index: 8; min-height: 58px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .page-header label { color: var(--muted); font-size: 13px; }
  .page-header select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  nav { top: 58px; height: calc(100vh - 58px); }
  .shell.reading { grid-template-columns: minmax(0, 1fr); }
  .shell.reading main { width: 100%; margin: auto; }
  .reader { font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
  .reader h1 { font-size: 28px; line-height: 1.3; }
  .reader h2 { font-size: 22px; margin-top: 32px; }
  .reader h3 { font-size: 18px; }
  .reader pre { white-space: pre-wrap; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 13px/1.6 var(--mono); }
  .reader code { font-family: var(--mono); font-size: .86em; }
  .reader blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--line); }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--soft); }
  .reader-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .reader-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .reader-tabs a, .artifact-list a { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--panel); text-decoration: none; }
  .artifact-list { display: grid; gap: 10px; margin: 16px 0; }
  .artifact-list small { display: block; color: var(--muted); }
  .artifact-section { padding: 20px; margin: 20px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .artifact-section > h2 { margin-top: 0; }
  .source-change { padding: 12px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; margin: 12px 0; }
  .unavailable-link { color: var(--muted); text-decoration: underline dotted; }
  #artifact-panel, .reader [data-anchor], .artifact-section, #artifact-proposals, article.item { scroll-margin-top: 80px; }
  .banner { top: 70px; }
  @media (max-width: 900px) { nav { top: auto; height: auto; } .page-header { padding: 10px 16px; } }
  .slice-label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 6px; }
  nav select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); padding: 8px; border-radius: 8px; }
  .topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 20px 0; }
  .topic-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .topic-card h3 { margin: 0 0 8px; font-size: 17px; }
  .topic-card p { color: var(--muted); margin: 8px 0; font-size: 13px; }
  .topic-card button { text-align: left; }
  .frame { color: var(--ink); font-size: 19px; line-height: 1.5; margin: 12px 0; }
  .lane-counts { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .lane-counts span { white-space: nowrap; }
  .slice-toolbar, .batch-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .slice-toolbar select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 12px; }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .question-row { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 0; }
  .question-row button { flex: 1; background: transparent; color: var(--ink); border: 0; text-align: left; padding: 4px; }
  .question-row small { display: block; color: var(--muted); }
  .question-row.current { border-left: 3px solid var(--accent); padding-left: 8px; }
  .batch-panel { background: var(--soft); border: 1px solid var(--accent); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; }
  .batch-panel h2 { font-size: 18px; margin: 0 0 8px; }
  .batch-panel p { margin: 8px 0; }
  .batch-panel progress, .topic-card progress { width: 100%; accent-color: var(--ok); height: 8px; }
  #focus { margin-top: 24px; scroll-margin-top: 80px; }
  .question-context { color: var(--muted); font-size: 13px; }
  @media (max-width: 650px) { .topic-grid { grid-template-columns: 1fr; } .question-row { align-items: flex-start; } }
</style>
</head>
<body>
<header class="page-header"><strong>Consequential Decisions</strong><label for="page-select">Read</label><select id="page-select"><option value="questions">Decision board</option><option value="agents">AGENTS</option><option value="runbook">RUNBOOK</option><option value="blueprint">BLUEPRINT</option><option value="lexicon">LEXICON</option><option value="landmarks">Landmarks</option><option value="adrs">ADRs</option><option value="ddrs">DDRs</option><option value="cdrs">CDRs</option></select><a href="#questions">Return to decisions</a></header>
<div class="shell">
  <nav>
    <h1>Grill Board</h1><div id="title" class="meta">Choose a manageable slice</div>
    <div class="meta" id="meta">loading…</div>
    <div class="progress" id="progress" title="pending / re-answer / answered / applied"></div>
    <label class="slice-label" for="board-view">Organize by</label><select id="board-view"><option value="decisions">Consequential decisions</option><option value="questions">Original questions</option></select>
    <label class="slice-label" for="intent">What do you feel like doing?</label>
    <select id="intent"><option value="all">Anything</option><option value="unblock">Unblock / direct work</option><option value="explore">Explore / settle decisions</option><option value="review">Review existing work</option></select>
    <label class="slice-label" for="topic">Think about…</label><select id="topic"></select>
    <label class="slice-label" for="scope">At what scale?</label><select id="scope"><option value="all">Any scale</option><option value="BLUEPRINT">Blueprint · whole product</option><option value="LANDMARK">Landmark · a direction</option><option value="SPEC">Spec · one capability</option><option value="TASK">Task · one step</option></select>
    <span class="slice-label">Where is it in the workflow?</span><div class="filters" id="filters"></div>
    <input type="search" id="search" placeholder="Search titles, questions, text…" aria-label="Search items">
    <button class="bulk" id="reset-slice">All topics</button>
    <button class="theme" id="theme">Toggle theme</button>
  </nav>
  <main>
    <div class="banner" id="banner"><span>An agent updated the board since you loaded it. Your saved answers are safe.</span><button class="bulk" onclick="location.reload()">Reload</button></div>
    <div id="questions-panel"><div id="batch-panel"></div><div class="notice" id="notice"></div><div id="overview"></div>
    <div id="content"><div class="empty">Loading the board…</div></div>
    </div><div id="artifact-panel" hidden></div>
  </main>
</div>
<dialog id="viewer"><header><span id="viewer-path"></span><button class="bulk" onclick="document.getElementById('viewer').close()">Close</button></header><pre id="viewer-text"></pre></dialog>
<script>
(() => {
  const STATUS_LABEL = { pending: 'Pending', stale: 'Re-answer', answered: 'Answered', applied: 'Applied', withdrawn: 'Withdrawn' };
  const STATUS_ORDER = ['pending', 'stale', 'answered', 'applied', 'withdrawn'];
  const state = { drafts: new Map(), errors: new Map(), inflight: new Map(), board: null, query: '', timers: new Map(), catalog: null, artifact: null, route: 0, revisions: new Map(), topic: 'all', intent: 'all', scope: 'all', lane: 'all', focus: null, picked: new Set(), batch: null, inBatch: false, size: 5, view: 'decisions', decision: null };
  try {
    const saved = JSON.parse(localStorage.getItem('grill-board-batch'));
    if (saved && Array.isArray(saved.ids) && saved.ids.length && saved.ids.every(id => typeof id === 'string') && saved.revisions && typeof saved.title === 'string') { state.batch = saved; state.inBatch = true; }
  } catch {}

  // Navigation metadata for this review package, not new answers or landmark records.
  // Unknown additions remain visible in Other topics until deliberately grouped.
  const TOPICS = [
    { id: 'direction', title: 'Purpose & boundaries', frame: 'what the Workbench is, whom it serves, and what belongs outside it', outcome: 'A clear destination and limits for the product.', numbers: [17,31,32,33,34,37,47,48,49,51,53,54,56,57,74,75,81,144,160,161,173,174,178,179] },
    { id: 'workflow', title: 'From idea to delivered work', frame: 'how an idea becomes work, how it moves, and what done means', outcome: 'Clear transitions, proof, approval and cleanup.', numbers: [1,2,6,8,9,20,26,35,36,46,55,58,65,66,72,79,80,82,83,84,85,88,99,101,103,105,106,115,121,122,124,125,127,128,129,130,132,133,142,143,145,146,147,148,159] },
    { id: 'roles', title: 'People, agents & responsibility', frame: 'who owns a job, who may delegate, and who checks the result', outcome: 'Distinct jobs and trustworthy handoffs between roles.', numbers: [14,15,28,63,67,86,87,134,135,136,137,138] },
    { id: 'context', title: 'Instructions, knowledge & memory', frame: 'what agents must obey, what they need to read, and what must survive a chat', outcome: 'The right context reaches the next agent without losing your intent.', numbers: [5,16,18,38,39,40,44,59,64,89,94,95,96,97,118,120,131,140,158,163,164,165,171,176,181] },
    { id: 'records', title: 'Maps, records & shared language', frame: 'how decisions, question cards, landmarks, Specs and names fit together', outcome: 'A readable map from your questions to decisions and delivery.', numbers: [4,10,11,13,27,29,60,62,78,90,91,92,93,102,107,108,110,111,112,139,141,166,167,168,169,170,172,177,180] },
    { id: 'tools', title: 'Tools, skills & everyday use', frame: 'the actions an agent or owner takes and how those actions should behave', outcome: 'Small, dependable actions with clear inputs and results.', numbers: [7,12,19,43,45,52,61,73,76,77,98,100,113,116,117,119,123,126,155,156,157,162,175] },
    { id: 'coordination', title: 'Shared work & connected rooms', frame: 'how agents share work across GitHub, devices and rooms', outcome: 'Reliable coordination, access and recovery without conflicting writers.', numbers: [3,22,23,25,30,41,42,68,69,70,71,109,114,154] },
    { id: 'release', title: 'Releases, upgrades & proof', frame: 'what should ship, where it is proven, and what an upgrade preserves', outcome: 'A release demonstrated in a real project with remaining gaps visible.', numbers: [21,24,50,104,149,150,151,152,153] },
    { id: 'other', title: 'Other topics', frame: 'the context and consequence of a newly added question', outcome: 'New questions stay reachable while their topic is being organized.', numbers: [] }
  ];
  const LANES = { all: 'All stages', pending: 'To answer', stale: 'Revisit', answered: 'With agents', applied: 'Applied', parked: 'Not now', withdrawn: 'Withdrawn' };
  const INTENTS = { all: 'Any kind of decision', unblock: 'Unblock / direct work', explore: 'Explore / settle decisions', review: 'Review existing work' };
  function topicFor(item) { return TOPICS.find(topic => topic.numbers.includes(Number(item.id?.replace('GB-', ''))))?.id || 'other'; }
  function intentFor(item) {
    if (item.id === 'GB-0180' || ['approve-spec', 'confirm-ddr', 'confirm-text', 'confirm-dqc'].includes(item.kind)) return 'review';
    return item.kind === 'owner-decision' ? 'unblock' : 'explore';
  }
  function laneFor(item) {
    return item.derivedStatus === 'pending' && item.answer?.itemRevision === item.revision && item.answer?.verdict === 'defer' ? 'parked' : item.derivedStatus;
  }
  function sliceCounts(items) {
    const counts = { pending: 0, stale: 0, answered: 0, applied: 0, parked: 0, withdrawn: 0 };
    for (const item of items) counts[laneFor(item)] += 1;
    return counts;
  }
  function matchesSlice(item, slice = state) {
    if (slice.topic && slice.topic !== 'all' && topicFor(item) !== slice.topic) return false;
    if (slice.intent && slice.intent !== 'all' && intentFor(item) !== slice.intent) return false;
    if (slice.scope && slice.scope !== 'all' && item.brief?.scope !== slice.scope) return false;
    if (slice.lane && slice.lane !== 'all' && laneFor(item) !== slice.lane) return false;
    const hay = `${JSON.stringify(item.brief || {})} ${item.id} ${item.title} ${item.question} ${item.current} ${item.proposal} ${item.draft ?? ''} ${(item.tags || []).join(' ')}`.toLowerCase();
    return !slice.query || hay.includes(slice.query);
  }
  function decisionMatches(group, slice = state) {
    const prompt = state.board.items.find(item => item.id === group.prompt);
    if (slice.lane && slice.lane !== 'all' && (!prompt || laneFor(prompt) !== slice.lane)) return false;
    const memberSlice = { ...slice, lane: 'all' };
    return group.members.some(member => matchesSlice(state.board.items.find(item => item.id === member.id), memberSlice));
  }
  function decisionPromptItems(slice = { ...state, lane: 'all' }) {
    return (state.board.decisions || []).filter(group => group.prompt && decisionMatches(group, slice)).map(group => state.board.items.find(item => item.id === group.prompt));
  }
  function batchProgress() {
    const ids = state.batch?.ids || [];
    const items = ids.map(id => state.board.items.find(item => item.id === id));
    const done = items.filter(item => item && ['answered', 'applied'].includes(item.derivedStatus) && !state.drafts.has(item.id)).length;
    const withdrawn = items.filter(item => item?.derivedStatus === 'withdrawn').length;
    return { total: ids.length, done, withdrawn, complete: ids.length > 0 && done + withdrawn === ids.length };
  }
  function persistBatch() { try { if (state.batch) localStorage.setItem('grill-board-batch', JSON.stringify(state.batch)); else localStorage.removeItem('grill-board-batch'); } catch {} }
  function startBatch(items) {
    if (!items.length) return;
    // A fixed membership never grows as answers are saved. Replacing a batch requires an explicit click.
    state.batch = { ids: items.map(item => item.id), revisions: Object.fromEntries(items.map(item => [item.id, item.revision])), title: `${TOPICS.find(topic => topic.id === state.topic)?.title || 'My chosen slice'} · ${INTENTS[state.intent]}` };
    state.inBatch = true; state.focus = items[0].id; state.picked.clear(); persistBatch(); render();
  }

  const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // A deliberately small Markdown renderer: paragraphs, headings, lists,
  // quotes, fenced code, inline code, bold and links. Everything else is text.
  function inline(text, source = '') {
    const token = /`([^`]+)`|\[([^\]]+)\]\(([^\s)]+)\)/g;
    let result = '', start = 0;
    const plain = value => esc(value).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    for (const match of String(text).matchAll(token)) {
      result += plain(String(text).slice(start, match.index));
      if (match[1] !== undefined) result += `<code>${esc(match[1])}</code>`;
      else {
        const label = plain(match[2]), target = match[3];
        if (/^https?:\/\//i.test(target)) result += `<a href="${esc(target)}" target="_blank" rel="noopener">${label}</a>`;
        else if (source && !/^[a-z][a-z\d+.-]*:/i.test(target)) {
          try {
            const url = new URL(target, `http://reader/${source}`);
            const local = decodeURIComponent(url.pathname.slice(1));
            const artifact = state.catalog?.artifacts.find(a => a.path === local);
            result += artifact ? `<a href="${esc(artifactHref(local, url.hash.slice(1)))}">${label}</a>` : `<span class="unavailable-link" title="Outside the seven artifact groups: ${esc(local)}">${label}</span>`;
          } catch { result += label; }
        } else result += label;
      }
      start = match.index + match[0].length;
    }
    return result + plain(String(text).slice(start));
  }
  function markdown(text, source = '') {
    const lines = String(text ?? '').replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      if (/^---\s*$/.test(line) && i === 0) {
        const buf = [];
        i += 1;
        while (i < lines.length && !/^---\s*$/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      if (/^\|/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\|/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        const cells = row => row.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(cell => inline(cell.trim().replace(/\\\|/g, '|'), source));
        if (buf.length > 1 && /^\|?[\s:|-]+\|?\s*$/.test(buf[1])) {
          out.push(`<div class="table-scroll"><table><thead><tr>${cells(buf[0]).map(cell => `<th>${cell}</th>`).join('')}</tr></thead><tbody>${buf.slice(2).map(row => `<tr>${cells(row).map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        } else out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) { const level = heading[1].length; const anchor = heading[2].toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-'); out.push(`<h${level} data-anchor="${esc(anchor)}">${inline(heading[2], source)}</h${level}>`); i += 1; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const buf = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
          let item = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '');
          i += 1;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) { item += ' ' + lines[i].trim(); i += 1; }
          buf.push(`<li>${inline(item, source)}</li>`);
        }
        out.push(`<${ordered ? 'ol' : 'ul'}>${buf.join('')}</${ordered ? 'ol' : 'ul'}>`);
        continue;
      }
      if (/^>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i += 1; }
        out.push(`<blockquote>${markdown(buf.join('\n'), source)}</blockquote>`);
        continue;
      }
      if (!line.trim()) { i += 1; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|>|\s*([-*]|\d+\.)\s+|\|)/.test(lines[i])) { buf.push(lines[i]); i += 1; }
      out.push(`<p>${inline(buf.join(' '), source)}</p>`);
    }
    return out.join('');
  }

  async function load() {
    const response = await fetch('/api/board', { cache: 'no-store' });
    if (!response.ok) throw new Error(`board ${response.status}`);
    state.board = await response.json();
    render();
  }

  function visible(item) {
    return state.inBatch ? state.batch?.ids.includes(item.id) : matchesSlice(item);
  }

  function countLine(items) {
    const c = sliceCounts(items);
    return `<div class="lane-counts">${Object.keys(c).filter(key => c[key]).map(key => `<span>${LANES[key]} <strong>${c[key]}</strong></span>`).join('')}</div>`;
  }

  function renderNavigation() {
    const board = state.board, decisionView = state.view === 'decisions' && !state.inBatch && board.decisions?.length;
    const counted = decisionView ? decisionPromptItems({ lane: 'all' }) : board.items, c = sliceCounts(counted);
    const completed = c.answered + c.applied, active = counted.length - c.withdrawn;
    document.getElementById('meta').textContent = `${completed} / ${active} ${decisionView ? 'rationale prompts answered' : 'answered'} · ${c.applied} applied · ${c.withdrawn} withdrawn`;
    document.getElementById('progress').innerHTML = `<span style="width:${100 * c.applied / Math.max(1, active)}%;background:var(--applied)" title="Applied ${c.applied}"></span><span style="width:${100 * c.answered / Math.max(1, active)}%;background:var(--ok)" title="With agents ${c.answered}"></span>`;
    const scoped = decisionView ? decisionPromptItems() : board.items.filter(item => matchesSlice(item, { ...state, lane: 'all' }));
    const counts = sliceCounts(scoped);
    document.getElementById('filters').innerHTML = Object.entries(LANES).map(([value, label]) => `<button class="chip" data-lane="${value}" aria-pressed="${state.lane === value}">${label} (${value === 'all' ? scoped.length : counts[value]})</button>`).join('');
    for (const chip of document.querySelectorAll('[data-lane]')) chip.onclick = () => { state.lane = chip.dataset.lane; state.inBatch = false; state.focus = null; state.picked.clear(); render(); };
    document.getElementById('topic').innerHTML = '<option value="all">All topics</option>' + TOPICS.filter(topic => board.items.some(item => topicFor(item) === topic.id)).map(topic => `<option value="${topic.id}">${esc(topic.title)}</option>`).join('');
    for (const key of ['topic', 'intent', 'scope']) {
      document.getElementById(key).value = state[key];
      document.getElementById(key).onchange = event => { state[key] = event.target.value; state.inBatch = false; state.focus = null; state.picked.clear(); render(); };
    }
    document.getElementById('reset-slice').onclick = () => { state.topic = state.intent = state.scope = state.lane = 'all'; state.query = ''; state.focus = null; state.inBatch = false; state.picked.clear(); document.getElementById('search').value = ''; render(); };
    document.getElementById('board-view').value = state.view;
    document.getElementById('board-view').onchange = event => { state.view = event.target.value; state.decision = null; state.focus = null; state.inBatch = false; render(); };
  }

  function renderBatchProgress() {
    const panel = document.getElementById('batch-panel');
    if (!state.batch) { panel.innerHTML = ''; return; }
    const p = batchProgress();
    panel.innerHTML = `<div class="batch-panel"><h2>${p.complete ? 'Your part of this batch is done' : 'Your current batch'}</h2><div>${esc(state.batch.title)}</div><p role="status">${p.done} / ${p.total} answered and saved${p.withdrawn ? ` · ${p.withdrawn} withdrawn` : ''}</p><progress value="${p.done + p.withdrawn}" max="${p.total}" aria-label="Batch progress"></progress><p>${p.complete ? 'A good stopping point. Answers awaiting application stay in With agents.' : 'A fixed set of questions. Notes alone, Not now, changed questions and unsaved edits do not count as answered.'}</p><div class="batch-actions"><button class="bulk" id="batch-toggle">${state.inBatch ? 'Pause and browse other slices' : 'Resume this batch'}</button><button class="bulk" id="batch-clear">${p.complete ? 'Finish batch' : 'Release this batch'}</button><small>Changing a batch never changes your answers.</small></div></div>`;
    document.getElementById('batch-toggle').onclick = () => { state.inBatch = !state.inBatch; state.focus = null; render(); };
    document.getElementById('batch-clear').onclick = () => { state.batch = null; state.inBatch = false; state.focus = null; persistBatch(); render(); };
  }

  function renderOverview() {
    const selected = TOPICS.find(topic => topic.id === state.topic);
    const overview = document.getElementById('overview');
    if (state.inBatch) { overview.innerHTML = ''; return; }
    const items = state.board.items.filter(visible);
    if (selected) {
      overview.innerHTML = `<h1>${esc(selected.title)}</h1><p class="frame">Think about { ${esc(selected.frame)} }</p><p>${esc(selected.outcome)}</p>${countLine(items)}`;
      return;
    }
    overview.innerHTML = `<h1>Choose what you want to think about</h1><p class="frame">One topic. A few decisions. A clear stopping point.</p><div class="topic-grid">${TOPICS.map(topic => {
      const all = items.filter(item => topicFor(item) === topic.id);
      if (!all.length) return '';
      const c = sliceCounts(all), done = c.answered + c.applied, total = all.length - c.withdrawn;
      return `<section class="topic-card"><h3>${esc(topic.title)}</h3><p>Think about { ${esc(topic.frame)} }</p><p>${esc(topic.outcome)}</p><strong>${done} / ${total} answered</strong><progress value="${done}" max="${Math.max(1, total)}" aria-label="${esc(topic.title)} answered"></progress>${countLine(all)}<p><button class="bulk" data-topic="${topic.id}">Open this topic · ${all.length} items</button></p></section>`;
    }).join('')}</div>`;
    for (const button of overview.querySelectorAll('[data-topic]')) button.onclick = () => { state.topic = button.dataset.topic; state.focus = null; state.picked.clear(); render(); };
  }

  function renderDecisions() {
    const groups = state.board.decisions || [];
    const membership = new Set(groups.flatMap(group => group.members.map(member => member.id)));
    const unassigned = state.board.items.filter(item => !membership.has(item.id));
    document.getElementById('batch-panel').innerHTML = '';
    document.getElementById('notice').innerHTML = '<strong>Start with the why.</strong> ADRs hold architecture choices, DDRs hold destination choices, and CDRs hold other consequential choices. Read the accepted rationale first. One answer can establish the principle agents use to resolve its related questions. Specific approvals remain attached to the work they approve.';
    const selected = groups.find(group => group.record === state.decision);
    const overview = document.getElementById('overview'), content = document.getElementById('content');
    if (!selected) {
      const shown = groups.filter(group => decisionMatches(group) || (state.query && `${group.record} ${group.title} ${group.question} ${group.why}`.toLowerCase().includes(state.query.toLowerCase())));
      const cards = list => list.map(group => `<section class="topic-card"><small>${esc(group.record)} · ${esc(group.status)}</small>${group.prompt ? `<span class="badge ${state.board.items.find(item => item.id === group.prompt).derivedStatus}">${LANES[laneFor(state.board.items.find(item => item.id === group.prompt))]}</span>` : ''}<h3>${esc(group.title)}</h3><p>${esc(group.question)}</p><p>${esc(group.why)}</p><button class="bulk" data-decision="${esc(group.record)}">${group.prompt ? 'Discuss the rationale' : group.status === 'proposed' ? 'Read proposed record' : 'Read established rationale'} · ${group.members.length} questions</button></section>`).join('');
      const prompts = shown.filter(group => group.prompt), retained = shown.filter(group => !group.prompt);
      const originals = state.board.items.filter(item => !item.tags?.includes('decision-rationale')).length;
      overview.innerHTML = `<h1>Consequential decisions</h1><p>${originals} preserved questions · ${groups.length} record homes · ${groups.filter(group => group.prompt).length} grouped rationale prompts</p><p>Start with a remaining premise below. Accepted decisions and their prior approvals stay available without another confirmation.</p><div class="topic-grid">${cards(prompts)}</div><details><summary>Browse the other decision-record homes (${retained.length})</summary><div class="topic-grid">${cards(retained)}</div></details>${unassigned.length ? `<p>${unassigned.length} new questions need a decision-record home. They remain available in Original questions.</p>` : ''}`;
      content.innerHTML = '';
      for (const button of overview.querySelectorAll('[data-decision]')) button.onclick = () => { state.decision = button.dataset.decision; state.focus = null; render(); };
      return;
    }
    overview.innerHTML = `<button class="bulk" id="all-decisions">All decisions</button><h1>${esc(selected.title)}</h1><p>${esc(selected.record)} · ${esc(selected.status)} · ${selected.members.length} related questions</p><div class="block"><h4>The underlying question</h4>${markdown(selected.question)}<h4>Why this matters</h4>${markdown(selected.why)}</div><p><a href="${esc(artifactHref(selected.path))}">Read the full ${selected.status === 'proposed' ? 'proposed' : 'current'} decision and its rationale</a></p>`;
    const prompt = state.board.items.find(item => item.id === selected.prompt);
    content.innerHTML = `${prompt ? card(prompt) : `<div class="notice">${selected.status === 'accepted' ? 'This principle is already accepted; you do not need to confirm it again.' : 'This record is proposed or historical. Its lifecycle is preserved; grouping does not accept it.'}</div>`}<details><summary>Supporting questions, prior answers and specific approvals (${selected.members.length})</summary><p>These retain their own identities and revisions. The grouped answer establishes rationale; it does not select every alternative below or approve delivered work.</p><div class="question-list">${selected.members.filter(member => member.id !== selected.prompt).map(member => { const item = state.board.items.find(item => item.id === member.id); return `<div class="question-row"><button data-member="${item.id}">${esc(item.title)}<small>${item.id} · revision ${item.revision}${item.kind === 'approve-spec' ? ' · specific delivery approval' : ''}</small></button><span class="badge ${item.derivedStatus}">${LANES[laneFor(item)]}</span></div>`; }).join('')}</div></details><div id="focus"></div>`;
    document.getElementById('all-decisions').onclick = () => { state.decision = null; state.focus = null; render(); };
    wire();
    for (const button of content.querySelectorAll('[data-member]')) button.onclick = () => { state.focus = button.dataset.member; const item = state.board.items.find(item => item.id === state.focus); document.getElementById('focus').innerHTML = card(item); wire(); document.getElementById('focus').scrollIntoView({ block: 'start' }); };
  }

  function render() {
    renderNavigation();
    if (state.view === 'decisions' && !state.inBatch && state.board.decisions?.length) { renderDecisions(); return; }
    renderBatchProgress();
    renderOverview();
    document.getElementById('notice').innerHTML = '<strong>Choose your own slice.</strong> Filter by kind of decision, topic, scale or workflow stage. Pick a batch of 3, 5 or 10, or select your own questions. Each opens on its own. <strong>Answered</strong> means your saved decision is ready for an agent; <strong>Applied</strong> means it was carried into its owner. These counts track this review, not implementation progress.';
    const overviewOnly = !state.inBatch && !state.focus && state.topic === 'all' && state.intent === 'all' && state.scope === 'all' && state.lane === 'all' && !state.query;
    const shown = state.inBatch ? state.batch.ids.map(id => state.board.items.find(item => item.id === id)).filter(Boolean) : state.board.items.filter(visible);
    const actionable = shown.filter(item => ['pending', 'stale', 'parked'].includes(laneFor(item)));
    const content = document.getElementById('content');
    if (overviewOnly) { content.innerHTML = ''; return; }
    if (state.inBatch && !state.focus) state.focus = shown.find(item => !['answered', 'applied', 'withdrawn'].includes(item.derivedStatus))?.id || shown[0]?.id;
    const toolbar = state.inBatch ? `<h2>Batch questions</h2><p>Choose any question below. The list stays fixed as you answer.</p>` : `<div class="slice-toolbar"><strong>${shown.length} in this slice</strong><label for="batch-size">Batch size</label><select id="batch-size">${[3,5,10].map(n => `<option value="${n}" ${state.size === n ? 'selected' : ''}>${n} questions</option>`).join('')}</select><button class="primary" id="start-batch" ${!actionable.length || state.batch ? 'disabled' : ''}>Start next ${Math.min(state.size, actionable.length)}</button><button class="bulk" id="start-picked" ${!state.picked.size || state.batch ? 'disabled' : ''}>Start selected (${state.picked.size})</button>${state.batch ? '<small>Resume or release your saved batch before starting another.</small>' : ''}</div>`;
    content.innerHTML = toolbar + (shown.length ? `<div class="question-list">${shown.map(item => `<div class="question-row ${state.focus === item.id ? 'current' : ''}">${!state.inBatch ? `<input type="checkbox" data-pick="${item.id}" aria-label="Select ${esc(item.title)}" ${state.picked.has(item.id) ? 'checked' : ''}>` : ''}<button data-open="${item.id}">${esc(item.title)}<small>${esc(TOPICS.find(t => t.id === topicFor(item)).title)} · ${esc(INTENTS[intentFor(item)])} · ${esc(item.brief?.scope || 'Unspecified scale')} · ${item.id}</small></button><span class="badge ${item.derivedStatus}">${LANES[laneFor(item)]}</span></div>`).join('')}</div>` : '<p class="empty">Nothing in this slice. Choose another topic or workflow stage.</p>') + '<div id="focus"></div>';
    for (const button of content.querySelectorAll('[data-open]')) button.onclick = () => { state.focus = button.dataset.open; renderFocus(); document.getElementById('focus').scrollIntoView({ block: 'start' }); };
    for (const checkbox of content.querySelectorAll('[data-pick]')) checkbox.onchange = () => { if (checkbox.checked) state.picked.add(checkbox.dataset.pick); else state.picked.delete(checkbox.dataset.pick); const button = document.getElementById('start-picked'); button.textContent = `Start selected (${state.picked.size})`; button.disabled = !state.picked.size || Boolean(state.batch); };
    if (!state.inBatch) {
      document.getElementById('batch-size').onchange = event => { state.size = Number(event.target.value); const button = document.getElementById('start-batch'); button.textContent = `Start next ${Math.min(state.size, actionable.length)}`; };
      document.getElementById('start-batch').onclick = () => startBatch(state.board.items.filter(visible).filter(item => ['pending', 'stale', 'parked'].includes(laneFor(item))).slice(0, state.size));
      document.getElementById('start-picked').onclick = () => startBatch(shown.filter(item => state.picked.has(item.id)));
    }
    renderFocus();
  }

  function renderFocus() {
    const item = state.board.items.find(item => item.id === state.focus);
    const panel = document.getElementById('focus');
    if (!panel) return;
    if (!item || !visible(item)) { panel.innerHTML = ''; return; }
    const topic = TOPICS.find(topic => topic.id === topicFor(item));
    const scale = { BLUEPRINT: 'the whole product', LANDMARK: 'one direction', SPEC: 'one capability', TASK: 'one concrete step' }[item.brief?.scope] || 'the named artifacts';
    panel.innerHTML = `<p class="question-context">${esc(INTENTS[intentFor(item)])} · Think about { ${esc(topic.frame)} } at the scale of ${scale}.</p>${card(item)}<div class="batch-actions"><button class="bulk" id="back-to-list">Back to this slice</button><button class="primary" id="next-question">Next question</button></div>`;
    wire();
    document.getElementById('back-to-list').onclick = () => document.getElementById('content').scrollIntoView({ block: 'start' });
    const shown = state.inBatch ? state.batch.ids.map(id => state.board.items.find(i => i.id === id)).filter(Boolean) : state.board.items.filter(visible);
    const index = shown.findIndex(i => i.id === item.id);
    document.getElementById('next-question').disabled = index < 0 || index === shown.length - 1;
    document.getElementById('next-question').onclick = () => { state.focus = shown[index + 1].id; renderFocus(); panel.scrollIntoView({ block: 'start' }); };
  }

  function card(item) {
    const status = item.derivedStatus;
    const answer = state.drafts.get(item.id) || item.answer || { verdict: '', note: '' };
    const needsNote = ['correct', 'finding', 'destination_change', 'answer', 'return_reworded'].includes(answer.verdict) && !answer.note.trim();
    const options = item.options.map((o) => `<button class="opt" data-value="${esc(o.value)}" data-hint="${esc(o.hint || '')}" aria-pressed="${answer.verdict === o.value}">${esc(o.label)}</button>${o.hint ? `<span class="option-impact">${esc(o.hint)}</span>` : ''}`).join('');
    const sources = (item.links || []).map((s) => {
      const view = s.path && !s.path.startsWith('/') ? `<button data-view="${esc(s.path)}">${esc(s.label)}</button>` : `<span>${esc(s.label)}</span>`;
      const gh = s.url ? ` <a href="${esc(s.url)}" target="_blank" rel="noopener" title="open on GitHub at ${esc(s.ref)}">↗</a>` : '';
      return `<span>${view}${gh}</span>`;
    }).join('');
    const applied = item.applied ? `<div class="applied-box"><strong>Applied</strong> by ${esc(item.applied.by)} on ${new Date(item.applied.at).toLocaleString()}: ${esc(item.applied.where)}${item.applied.agentNote ? ` — ${esc(item.applied.agentNote)}` : ''}<br><small>Your answer then: ${esc(item.applied.verdict || '(note only)')}${item.applied.note ? ` — "${esc(item.applied.note)}"` : ''}</small></div>` : '';
    const stale = status === 'stale' ? `<div class="stale-box">This item changed after you answered (now revision ${item.revision}; you answered revision ${answer.itemRevision}). Your earlier answer was <strong>${esc(answer.verdict || '(note only)')}</strong>${answer.note ? `: "${esc(answer.note)}"` : ''}. Please answer again.</div>` : '';
    const history = (item.history || []).filter((h) => h.revision > 1 || /^applied|^withdrawn/.test(h.reason || '')).map((h) => `${new Date(h.at).toLocaleDateString()} · ${esc(h.by)}: ${esc(h.reason)}`);
    return `<article class="item" id="${item.id}" data-id="${item.id}" data-status="${status}" data-revision="${item.revision}">
      <div class="item-head"><h3>${esc(item.title)}<small class="identity">${item.id} · revision ${item.revision}</small></h3><span><span class="badge ${status}">${STATUS_LABEL[status]}</span><span class="kind">${esc({'approve-spec':'Delivery approval','confirm-dqc':'Confirm understanding','confirm-ddr':'Review existing decision','confirm-text':'Review draft text','choice':'Choose a direction','owner-decision':'Unblock work'}[item.kind] || item.kind)}</span></span></div>
      <p class="q">${esc(item.question)}</p>
      <div class="sources">${(item.sources || []).filter(source => state.catalog?.artifacts.some(a => a.path === source.path)).map(source => `<a href="${esc(artifactHref(source.path, '', item.id))}">Read ${esc(source.label)} and its proposals</a>`).join('')}</div>
      ${item.brief ? decisionBrief(item) : `<div class="block"><h4>Context</h4>${markdown(item.current)}</div><div class="block"><h4>Agent recommendation</h4>${markdown(item.proposal)}</div>`}
      ${item.draft ? `<details class="draft"><summary>Read proposed draft or review text</summary><div class="block">${markdown(item.draft)}</div></details>` : ''}
      ${sources ? `<details class="draft"><summary>Evidence and source links</summary><div class="sources">${sources}</div><div class="block">${markdown(item.current)}</div><div class="block">${markdown(item.proposal)}</div></details>` : ''}
      ${history.length ? `<div class="sources"><span>History:</span>${history.map((h) => `<span>${h}</span>`).join('')}</div>` : ''}
      ${stale}${applied}
      <div class="answer">
        <div class="options">${options}</div>
        <div class="hint">${esc(item.options.find((o) => o.value === answer.verdict)?.hint || 'Pick a verdict, then add any notes. Saves as you type.')}</div>
        <textarea class="${needsNote ? 'needs-note' : ''}" placeholder="Notes, corrections, the words you want used…">${esc(answer.note)}</textarea>
        <div class="save"><span class="status">${state.drafts.has(item.id) ? 'Not saved yet' : answer.at ? `Saved ${new Date(answer.at).toLocaleString()}` : 'Not answered yet'}</span><span class="err">${esc(state.errors.get(item.id) || '')}</span></div>
      </div>
    </article>`;
  }

  function decisionBrief(item) {
    const b = item.brief;
    const history = b.history.split(/(?=^### )/m).filter((part) => part.trim()).map((part) => {
      const lines = part.split('\n');
      return `<details class="history-entry"><summary>${esc(lines.shift().replace(/^### /, ''))}</summary>${markdown(lines.join('\n'))}</details>`;
    }).join('');
    return `<div class="brief-summary">${markdown(b.summary)}</div>
      <div class="block"><h4>What this concerns</h4>${markdown(b.artifacts)}</div>
      <div class="block"><h4>Why this choice matters</h4>${markdown(b.why)}</div>
      <div class="recommendation"><h4>Recommended answer · agent proposal</h4>${markdown(b.recommendation)}</div>
      <div class="block"><h4>What would change</h4>${markdown(b.changes)}</div>
      <div class="block"><h4>Consequences and tradeoffs</h4>${markdown(b.impact)}</div>
      <details class="draft"><summary>Related Destination Question Cards and original grilling history</summary>${history}</details>`;
  }

  function wire() {
    for (const article of document.querySelectorAll('article.item')) {
      const id = article.dataset.id;
      for (const opt of article.querySelectorAll('.opt')) {
        opt.onclick = () => {
          const pressed = opt.getAttribute('aria-pressed') === 'true';
          for (const other of article.querySelectorAll('.opt')) other.setAttribute('aria-pressed', 'false');
          if (!pressed) opt.setAttribute('aria-pressed', 'true');
          article.querySelector('.hint').textContent = pressed ? 'Pick a verdict, then add any notes. Saves as you type.' : (opt.dataset.hint || '');
          save(article, 0);
        };
      }
      article.querySelector('textarea').oninput = () => save(article, 700);
      for (const button of article.querySelectorAll('[data-view]')) button.onclick = () => viewFile(button.dataset.view);
    }
    for (const button of document.querySelectorAll('[data-bulk]')) {
      button.onclick = async () => {
        const group = button.dataset.bulk;
        const targets = [...document.querySelectorAll(`#g-${CSS.escape(group)} article.item[data-status="pending"]`)].filter((a) => a.querySelector('.opt[data-value="confirm"]'));
        if (!targets.length) return;
        if (!confirm(`Mark ${targets.length} unanswered item(s) in this group as Confirm? Items you already answered are untouched.`)) return;
        for (const article of targets) {
          for (const other of article.querySelectorAll('.opt')) other.setAttribute('aria-pressed', other.dataset.value === 'confirm' ? 'true' : 'false');
          await save(article, 0, true);
        }
        await load();
      };
    }
  }

  function save(article, delay, immediate) {
    const id = article.dataset.id;
    const draft = { verdict: article.querySelector('.opt[aria-pressed="true"]')?.dataset.value ?? '', note: article.querySelector('textarea').value, itemRevision: Number(article.dataset.revision) };
    state.drafts.set(id, draft);
    renderBatchProgress();
    clearTimeout(state.timers.get(id));
    const run = async () => {
      const { verdict, note, itemRevision } = draft;
      const statusEl = article.querySelector('.save .status');
      const errEl = article.querySelector('.save .err');
      statusEl.textContent = 'Saving…';
      try {
        const response = await fetch(`/api/answers/${id}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ verdict, note, itemRevision }) });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || response.status);
        statusEl.textContent = `Saved ${new Date(body.at).toLocaleTimeString()}`;
        errEl.textContent = '';
        state.errors.delete(id);
        const item = state.board.items.find((candidate) => candidate.id === id);
        if (item) { item.answer = body; item.derivedStatus = body.derivedStatus; }
        if (state.drafts.get(id) === draft) state.drafts.delete(id);
        const currentArticle = document.getElementById(id);
        if (currentArticle && currentArticle !== article && !state.drafts.has(id)) {
          currentArticle.querySelector('.save .status').textContent = `Saved ${new Date(body.at).toLocaleTimeString()}`;
          currentArticle.querySelector('.save .err').textContent = '';
          currentArticle.dataset.status = body.derivedStatus;
          currentArticle.querySelector('.badge').className = `badge ${body.derivedStatus}`;
          currentArticle.querySelector('.badge').textContent = STATUS_LABEL[body.derivedStatus];
        }
        article.dataset.status = body.derivedStatus;
        article.querySelector('.badge').className = `badge ${body.derivedStatus}`;
        article.querySelector('.badge').textContent = STATUS_LABEL[body.derivedStatus];
        const needsNote = ['correct', 'finding', 'destination_change', 'answer', 'return_reworded'].includes(verdict) && !note.trim();
        article.querySelector('textarea').classList.toggle('needs-note', needsNote);
        refreshCounts();
      } catch (error) {
        statusEl.textContent = 'Not saved';
        const message = `Save failed: ${error.message}. Your unsaved text remains here; edit it again to retry.`;
        state.errors.set(id, message);
        errEl.textContent = message;
        const currentArticle = document.getElementById(id);
        if (currentArticle) {
          currentArticle.querySelector('.save .status').textContent = 'Not saved';
          currentArticle.querySelector('.save .err').textContent = message;
        }
      }
    };
    const queued = () => { const promise = (state.inflight.get(id) || Promise.resolve()).then(run); state.inflight.set(id, promise); promise.finally(() => { if (state.inflight.get(id) === promise) state.inflight.delete(id); }); return promise; };
    if (immediate) return queued();
    state.timers.set(id, setTimeout(queued, delay));
  }

  function refreshCounts() {
    renderNavigation();
    if (state.view === 'decisions' && !state.inBatch && state.board.decisions?.length) return;
    renderBatchProgress();
    renderOverview();
    const start = document.getElementById('start-batch');
    if (start) {
      const remaining = state.board.items.filter(visible).filter(item => ['pending', 'stale', 'parked'].includes(laneFor(item))).length;
      start.textContent = `Start next ${Math.min(state.size, remaining)}`;
      start.disabled = !remaining || Boolean(state.batch);
    }
    for (const row of document.querySelectorAll('.question-row')) {
      const item = state.board.items.find(item => item.id === row.querySelector('[data-open]').dataset.open);
      row.querySelector('.badge').textContent = LANES[laneFor(item)];
      row.querySelector('.badge').className = `badge ${item.derivedStatus}`;
    }
  }

  async function viewFile(relPath) {
    if (state.catalog?.artifacts.some(a => a.path === relPath)) { location.hash = artifactHref(relPath); return; }
    const dialog = document.getElementById('viewer');
    document.getElementById('viewer-path').textContent = relPath;
    document.getElementById('viewer-text').textContent = 'Loading…';
    dialog.showModal();
    try {
      const response = await fetch(`/api/file?path=${encodeURIComponent(relPath)}`);
      const body = await response.json();
      document.getElementById('viewer-text').textContent = response.ok ? body.text : `Could not read: ${body.error?.message}`;
    } catch (error) {
      document.getElementById('viewer-text').textContent = `Could not read: ${error.message}`;
    }
  }

  function artifactHref(file, anchor = '', item = '') {
    const params = new URLSearchParams({ artifact: file });
    if (anchor) params.set('anchor', anchor);
    if (item) params.set('item', item);
    return `#${params}`;
  }

  function recordFields(value, source, depth = 2) {
    if (Array.isArray(value)) return value.length ? value.map((entry, index) => `<section><h${Math.min(6, depth)}>Entry ${index + 1}</h${Math.min(6, depth)}>${recordFields(entry, source, depth + 1)}</section>`).join('') : '<p>None recorded.</p>';
    if (value && typeof value === 'object') return Object.entries(value).map(([key, entry]) => `<section><h${Math.min(6, depth)}>${esc(key.replace(/_/g, ' '))}</h${Math.min(6, depth)}>${recordFields(entry, source, depth + 1)}</section>`).join('');
    return typeof value === 'string' ? markdown(value, source) : `<p>${esc(value === null ? 'null' : value)}</p>`;
  }

  async function routePage() {
    if (!state.catalog) return;
    const serial = ++state.route;
    const params = new URLSearchParams(location.hash.slice(1));
    const file = params.get('artifact'), group = params.get('artifacts');
    const reading = Boolean(file || group);
    if (reading && !state.reading) state.questionScroll = window.scrollY;
    const returning = !reading && state.reading;
    state.reading = reading;
    document.querySelector('.shell').classList.toggle('reading', reading);
    document.querySelector('.shell > nav').hidden = reading;
    document.getElementById('questions-panel').hidden = reading;
    const panel = document.getElementById('artifact-panel');
    panel.hidden = !reading;
    state.artifact = null;
    if (!reading) {
      document.getElementById('page-select').value = 'questions';
      const id = location.hash.slice(1);
      if (/^GB-\d{4}$/.test(id)) {
        const target = state.board.items.find(item => item.id === id);
        if (target) { state.inBatch = false; state.topic = topicFor(target); state.intent = state.scope = state.lane = 'all'; state.query = ''; state.focus = target.id; document.getElementById('search').value = ''; render(); }
        document.getElementById(id)?.scrollIntoView({ block: 'start' });
      } else if (returning) window.scrollTo(0, state.questionScroll || 0);
      return;
    }
    panel.innerHTML = '<p>Loading artifacts…</p>';
    try {
      const response = await fetch('/api/artifacts', { cache: 'no-store' });
      if (!response.ok) throw new Error(`inventory ${response.status}`);
      const catalog = await response.json();
      if (serial !== state.route) return;
      state.catalog = catalog;
      if (!file) {
        const selected = catalog.groups.find(candidate => candidate.id === group);
        if (!selected) throw new Error('Unknown artifact group');
        document.getElementById('page-select').value = group;
        const records = catalog.artifacts.filter(a => a.group === group).sort((a, b) => Number(b.status === 'accepted') - Number(a.status === 'accepted') || a.title.localeCompare(b.title));
        panel.innerHTML = `<h1>${esc(selected.title)}</h1><p>Open the full record. Accepted active decisions appear first; proposed and historical records remain available.</p><div class="artifact-list">${records.map(a => `<a href="${esc(artifactHref(a.path))}"><strong>${esc(a.title)}</strong><small>${esc(a.status)}${a.id ? ` · ${esc(a.id)}` : ''}</small><small>${esc(a.path)}</small></a>`).join('') || '<p>No records in this collection.</p>'}</div>`;
        panel.scrollIntoView({ block: 'start' });
        return;
      }
      const result = await fetch(`/api/artifact?path=${encodeURIComponent(file)}`, { cache: 'no-store' });
      const artifact = await result.json();
      if (serial !== state.route) return;
      if (!result.ok) throw new Error(artifact.error?.message || result.status);
      state.artifact = artifact;
      document.getElementById('page-select').value = artifact.group;
      const previous = state.revisions.get(file);
      state.revisions.set(file, artifact.revision);
      const itemId = params.get('item');
      const drafts = artifact.related.filter(item => item.draftKind === 'full-text');
      const related = artifact.related.map(item => `<section class="artifact-section" id="draft-${item.id}"><h2>${esc(item.title)}</h2><p class="reader-meta">${item.id} · item revision ${item.revision} · ${esc(item.status)} · package captured ${esc(item.snapshotAt)} · item updated ${esc(item.itemUpdatedAt)}<br>Source at ${item.sources.map(source => esc(source.ref || 'unrecorded revision')).join(', ')}</p><p>${esc(item.question)}</p><a href="#${item.id}">Read and answer this question</a><h3>${item.draftKind === 'full-text' ? 'Proposed draft / review snapshot · full text' : item.draftKind === 'excerpt' ? 'Proposed draft · excerpt only' : 'Proposed change · no complete draft'}</h3><p>Review material; displaying it does not accept a change.${item.draftKind !== 'full-text' ? ' No complete replacement artifact is supplied by this item.' : ''}</p><div class="reader">${item.draft ? markdown(item.draft, file) : ''}<h3>Proposed change</h3>${markdown(item.proposal, file)}</div></section>`).join('');
      panel.innerHTML = `<a href="#artifacts=${esc(artifact.group)}">All ${esc(catalog.groups.find(g => g.id === artifact.group).title)}</a><h1>${esc(artifact.title)}</h1><p class="reader-meta">${esc(artifact.path)} · ${esc(artifact.status)}${artifact.id ? ` · ${esc(artifact.id)}` : ''}</p><div id="source-change" class="source-change" ${previous && previous !== artifact.revision ? '' : 'hidden'}>Source revision changed since your previous reading. This is the current text; review snapshots below retain their own revisions. <button class="bulk" id="refresh-artifact">Read latest source</button></div><div class="reader-tabs"><a href="${esc(artifactHref(file, 'current'))}">Current artifact</a><a href="${esc(artifactHref(file, 'proposals'))}">Drafts and proposed changes (${artifact.related.length})</a></div><section class="artifact-section" id="current-artifact"><h2>Current artifact</h2><p class="reader-meta">Current checkout · tree ${esc(artifact.tree || 'unavailable')}<br>Content SHA-256 ${esc(artifact.revision)} · read ${esc(artifact.readAt)}</p>${artifact.format === 'json' ? '<p>Current Landmark JSON record, including every field and its recorded history. The future LANDMARK.md model is not installed here.</p>' : ''}<div class="reader">${artifact.format === 'json' ? recordFields(JSON.parse(artifact.text), file) + `<details><summary>Complete source JSON</summary><pre>${esc(artifact.text)}</pre></details>` : markdown(artifact.text, file)}</div></section><section id="artifact-proposals"><h2>Available drafts and proposed changes</h2>${drafts.length ? '' : '<p>No complete draft is available for this artifact. Existing proposed changes are shown below without inventing a replacement.</p>'}${related || '<p>No linked proposals in the current review package.</p>'}</section>`;
      document.getElementById('refresh-artifact').onclick = routePage;
      const anchor = params.get('anchor');
      const target = itemId ? document.getElementById(`draft-${itemId}`) : anchor === 'current' ? document.getElementById('current-artifact') : anchor === 'proposals' ? document.getElementById('artifact-proposals') : [...panel.querySelectorAll('[data-anchor]')].find(element => element.dataset.anchor === anchor);
      (target || panel).scrollIntoView({ block: 'start' });
    } catch (error) {
      if (serial === state.route) panel.innerHTML = `<h1>Could not read artifact</h1><p>${esc(error.message)}</p><a href="#questions">Return to questions</a>`;
    }
  }

  document.getElementById('page-select').onchange = event => {
    const group = event.target.value;
    const root = state.catalog?.artifacts.find(a => a.group === group);
    location.hash = group === 'questions' ? '#questions' : ['agents', 'runbook', 'blueprint', 'lexicon'].includes(group) && root ? artifactHref(root.path) : `#artifacts=${group}`;
  };
  window.addEventListener('hashchange', routePage);

  document.getElementById('search').oninput = (event) => { state.query = event.target.value.trim().toLowerCase(); state.inBatch = false; state.focus = null; state.picked.clear(); render(); };
  document.getElementById('theme').onclick = () => {
    const root = document.documentElement;
    const current = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = current === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('grill-board-theme', root.dataset.theme); } catch {}
  };
  try { const saved = localStorage.getItem('grill-board-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch {}

  // Agents may add, revise or apply items while the page is open. Poll the
  // items file's modification time and offer a reload rather than redrawing
  // under the owner's hands.
  setInterval(async () => {
    if (!state.board) return;
    try {
      const response = await fetch('/api/status', { cache: 'no-store' });
      const status = await response.json();
      if (status.itemsMtime !== state.board.itemsMtime) document.getElementById('banner').classList.add('show');
      if (state.artifact) {
        const viewed = state.artifact;
        const current = await fetch(`/api/artifact?path=${encodeURIComponent(viewed.path)}`, { cache: 'no-store' });
        const body = await current.json();
        if (state.artifact === viewed && (!current.ok || body.revision !== viewed.revision)) document.getElementById('source-change').hidden = false;
      }
    } catch {}
  }, 15000);

  window.addEventListener('beforeunload', (event) => { if (state.drafts.size) { event.preventDefault(); event.returnValue = ''; } });

  Promise.all([load(), fetch('/api/artifacts', { cache: 'no-store' }).then(async response => { if (!response.ok) throw new Error(`inventory ${response.status}`); state.catalog = await response.json(); })]).then(() => { render(); return routePage(); }).catch((error) => { document.getElementById('content').innerHTML = `<div class="empty">Could not load the board: ${esc(error.message)}</div>`; });
})();
</script>
</body>
</html>
